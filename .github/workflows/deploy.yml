name: Deploy to Tencent Cloud

on:
  push:
    branches:
      - main
    # Installing or updating release-control workflows/policies must not
    # trigger the application deployment. A mixed commit containing app files
    # still runs because at least one changed path is not ignored.
    paths-ignore:
      - '.github/**'
      # Android release metadata changes require an explicit app-only dispatch
      # so the default push deployment cannot start database phases.
      - 'app/api/app/version/route.ts'
      - 'lib/app-version.ts'
      - 'tests/app-version.test.ts'
      - 'tests/update-android-version-env.test.ts'
      - 'docs/app-version-api.md'
      - 'scripts/update-android-version-env.mjs'
      - 'scripts/update-android-version-env.d.mts'
      # RC11 Native Bearer runtime changes and release infrastructure require
      # an explicit skip-db deployment; never start the default full-DB push.
      - 'app/api/material-redemptions/route.ts'
      - 'app/api/friends/list/route.ts'
      - 'docs/android-beta21-rc11-release-runbook.md'
      - 'scripts/android-rc11-cos-publish.d.mts'
      - 'scripts/android-rc11-cos-publish.mjs'
      # RC13 release-control changes must use explicit app-only dispatch.
      - 'scripts/android-rc13-release.mjs'
      - 'scripts/android-rc13-multipart.mjs'
      - 'scripts/android-rc13-release.json'
      - 'tests/android-rc13-release.test.mjs'
      - 'tests/android-rc13-multipart.test.mjs'
      - 'scripts/assert-native-bearer-rollback-result.d.mts'
      - 'scripts/assert-native-bearer-rollback-result.mjs'
      - 'scripts/assert-release-main.d.mts'
      - 'scripts/assert-release-main.mjs'
      # RC11 signer verification is release infrastructure, not app runtime.
      - 'scripts/verify-android-apk-signature.d.mts'
      - 'scripts/verify-android-apk-signature.mjs'
      - 'scripts/rollback-production-git.sh'
      - 'tests/android-rc11-publish-infrastructure.test.ts'
      - 'tests/rc11-apksigner-diagnostics.test.mjs'
      - 'scripts/production-backup-gate.mjs'
      - 'scripts/production-backup-gate.d.mts'
      - 'scripts/deploy-production-git.sh'
      - 'scripts/production-risk-attestation.mjs'
      - 'scripts/diagnose-production-attestation.mjs'
      - 'scripts/quarantine-invalid-production-attestation.mjs'
      - 'tests/production-backup-gate.test.ts'
      - 'tests/deploy-backup-gate.test.ts'
      - 'tests/production-attestation-diagnostic.test.mjs'
      - 'tests/production-attestation-quarantine.test.mjs'
      - 'tests/topic-v2-main-integration.test.ts'
      - 'tests/production-risk-attestation.test.mjs'
      - 'middleware.ts'
      - 'tests/deploy-skip-db-mode.test.ts'
      - 'tests/middleware-auth.test.ts'
      - 'tests/mobile-bearer-route-integration.test.ts'
      - 'tests/profile-background-mobile-lookup.test.ts'
      # Moderation identity changes require an explicit skip-db deployment.
      - 'app/api/notifications/route.ts'
      - 'app/notifications/NotificationsClient.tsx'
      - 'lib/notifications.ts'
      - 'lib/moderation-notification-identity.ts'
      - 'tests/moderation-notification-identity.test.ts'
  workflow_dispatch:
    inputs:
      db_mode:
        description: Database phase for this reviewed main-branch deployment
        required: true
        type: choice
        options:
          - full
          - skip-db
        default: full
      restore_drill_waiver:
        description: >-
          Explicit, written, one-off approval that waives ONLY the restore-drill
          requirement (schemaVersion=2). Defaults to 'none' so a push event can
          never take the waiver path. Requires a signed, exact-SHA, short-lived
          host attestation; all automatic-backup/PITR checks remain strict.
        required: false
        type: choice
        options:
          - none
          - approved
        default: none
      risk_acceptance:
        description: >-
          Explicit, written, one-off RISK ACCEPTANCE (schemaVersion=3) for a
          release whose owner accepts, in writing, that NO independent CynosDB
          backup/PITR verification and NO restore drill were performed. Defaults
          to 'none' so a push event can never take this path. The attestation
          MUST NOT assert any backup/PITR/drill fact (fabrication is rejected);
          the gate prints BACKUP_VERIFIED=NO / BACKUP_PITR_VERIFIED=NO. Strict
          schemaVersion 1 (and drill-only v2) paths are unchanged. This is not a
          permanent bypass; it is a single-SHA, short-lived, audited waiver.
        required: false
        type: choice
        options:
          - none
          - approved
        default: none

permissions:
  contents: read

concurrency:
  group: production-deploy
  # A newer push must wait; cancelling a deployment after current was switched
  # can otherwise strand PM2 on a release that the workflow reports as failed.
  cancel-in-progress: false
  # GitHub's standard single-pending queue; never cancel the active deployment.

env:
  APP_DIR: /home/apps/easonfansclub
  APP_PORT: "3000"
  PRODUCTION_DOMAIN: ecfc.fans

jobs:
  deploy:
    # Deployment must always use a reviewed main-branch commit. The
    # workflow_dispatch trigger is intentionally not an escape hatch for an
    # arbitrary release or feature branch.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[infra-only]'))
    name: Deploy production
    environment: Production
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Validate deployment secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          PINNED_HOST_KEY_SHA256: ${{ vars.PRODUCTION_SSH_HOST_KEY_SHA256 }}
        run: |
          set -euo pipefail

          for secret_name in SERVER_HOST SERVER_USER SERVER_PORT SERVER_SSH_KEY PINNED_HOST_KEY_SHA256; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Required production SSH setting ${secret_name} is missing or empty."
              exit 1
            fi
          done
          if [[ ! "${PINNED_HOST_KEY_SHA256}" =~ ^SHA256:[A-Za-z0-9+/]+=?$ ]]; then
            echo "::error::Pinned production SSH host fingerprint has an invalid format."
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Require protected current main before production deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/assert-release-main.mjs

      - name: Configure deployment SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          PINNED_HOST_KEY_SHA256: ${{ vars.PRODUCTION_SSH_HOST_KEY_SHA256 }}
        run: |
          set -euo pipefail

          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SERVER_SSH_KEY}" \
            | tr -d '\r' \
            > "${RUNNER_TEMP}/easonfansclub_deploy_key"
          chmod 600 "${RUNNER_TEMP}/easonfansclub_deploy_key"

          echo "===== [ssh] Verify Tencent Cloud host key against the protected fingerprint ====="
          scan_file="${RUNNER_TEMP}/easonfansclub_host_scan"
          verified_file="${RUNNER_TEMP}/easonfansclub_known_hosts"
          key_line_file="${RUNNER_TEMP}/easonfansclub_host_key_line"
          timeout 30s ssh-keyscan \
            -T 15 \
            -p "${SERVER_PORT}" \
            -H "${SERVER_HOST}" \
            > "${scan_file}" 2>/dev/null
          : > "${verified_file}"
          while IFS= read -r entry; do
            [[ -n "${entry}" && "${entry}" != \#* ]] || continue
            printf '%s\n' "${entry}" > "${key_line_file}"
            fingerprint="$(ssh-keygen -lf "${key_line_file}" -E sha256 | awk 'NR == 1 { print $2 }')"
            if [[ "${fingerprint}" == "${PINNED_HOST_KEY_SHA256}" ]]; then
              printf '%s\n' "${entry}" >> "${verified_file}"
            fi
          done < "${scan_file}"
          if [[ ! -s "${verified_file}" ]]; then
            echo "::error::Scanned Tencent Cloud host key did not match the protected fingerprint."
            exit 1
          fi
          ssh-keygen -lf "${verified_file}" -E sha256 \
            | awk '{ print $2 }' \
            | grep -Fx -- "${PINNED_HOST_KEY_SHA256}" >/dev/null
          install -m 600 "${verified_file}" "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Check server connection and directory permissions
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          APP_DIR: ${{ env.APP_DIR }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          [[ -s "${RUNNER_TEMP}/easonfansclub_deploy_key" && -s "${HOME}/.ssh/known_hosts" ]] || {
            echo "::error::Strict deployment SSH credentials were not prepared."
            exit 1
          }
          [[ "${SERVER_HOST}" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Production SSH host format is invalid."; exit 1; }
          [[ "${SERVER_USER}" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "::error::Production SSH user format is invalid."; exit 1; }
          [[ "${SERVER_PORT}" =~ ^[0-9]{1,5}$ ]] || { echo "::error::Production SSH port is invalid."; exit 1; }
          (( 10#${SERVER_PORT} >= 1 && 10#${SERVER_PORT} <= 65535 )) || { echo "::error::Production SSH port is invalid."; exit 1; }

          remote_host="${SERVER_USER}@${SERVER_HOST}"
          printf -v remote_command 'APP_DIR=%q DEPLOY_SHA=%q bash -s' "${APP_DIR}" "${DEPLOY_SHA}"
          ssh_options=(
            -p "${SERVER_PORT}"
            -i "${RUNNER_TEMP}/easonfansclub_deploy_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts"
            -o GlobalKnownHostsFile=/dev/null
            -o ConnectTimeout=10
            -o ServerAliveInterval=5
            -o ServerAliveCountMax=2
          )

          timeout --foreground --signal=TERM --kill-after=10s 60s \
            ssh -T "${ssh_options[@]}" "${remote_host}" "${remote_command}" <<'REMOTE'
          set -euo pipefail

          test -d "${APP_DIR}"
          test -w "${APP_DIR}"
          if ! command -v flock >/dev/null 2>&1; then
            echo 'flock is not installed on the deployment host.' >&2
            exit 1
          fi
          if ! command -v timeout >/dev/null 2>&1; then
            echo 'GNU timeout is not installed on the deployment host.' >&2
            exit 1
          fi
          test -f "${APP_DIR}/.deploy.lock"
          exec 9<>"${APP_DIR}/.deploy.lock"
          if ! flock -n 9; then
            echo 'Another production deployment is already in progress.' >&2
            exit 1
          fi

          test -d "${APP_DIR}/releases"
          test -w "${APP_DIR}/releases"
          test -d "${APP_DIR}/shared"
          test -w "${APP_DIR}/shared"

          if [[ ! "${DEPLOY_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'DEPLOY_SHA is not a 40-character hexadecimal Git SHA.' >&2
            exit 1
          fi

          if ! command -v git >/dev/null 2>&1; then
            echo 'SERVER_GIT_ACCESS=NOT_READY: git is not installed on the deployment host.' >&2
            exit 1
          fi
          if [ ! -d "${APP_DIR}/repo" ]; then
            echo 'SERVER_GIT_ACCESS=NOT_READY: the cached repository is not configured.' >&2
            echo "Configure a read-only GitHub Deploy Key and clone the repository at ${APP_DIR}/repo before enabling this deployment path." >&2
            exit 1
          fi
          if ! git -C "${APP_DIR}/repo" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo 'SERVER_GIT_ACCESS=NOT_READY: the cached repository is not a usable non-bare Git checkout.' >&2
            exit 1
          fi
          if ! git -C "${APP_DIR}/repo" remote get-url origin >/dev/null 2>&1; then
            echo 'SERVER_GIT_ACCESS=NOT_READY: the cached repository has no origin remote.' >&2
            exit 1
          fi

          if [ ! -e "${APP_DIR}/shared/.env" ] && [ ! -L "${APP_DIR}/shared/.env" ]; then
            echo 'shared/.env is missing; refusing to copy or create production configuration during preflight.' >&2
            exit 1
          fi

          if [ ! -L "${APP_DIR}/current" ]; then
            echo 'Production current must already be a symlink into releases/; refusing pre-migration bootstrap.' >&2
            echo 'Refusing to deploy into the legacy live directory.' >&2
            exit 1
          fi
          current_target="$(readlink -f -- "${APP_DIR}/current")"
          case "${current_target}" in
            "${APP_DIR}/releases/"*) ;;
            *)
              echo "Production current target is outside releases/: ${current_target}" >&2
              exit 1
              ;;
          esac
          test -r "${APP_DIR}/shared/.env"
          test -s "${APP_DIR}/shared/.env"
          test -s "${current_target}/.deployed-sha"
          if ! grep -Eq '^[0-9a-f]{40}$' "${current_target}/.deployed-sha"; then
            echo 'Current release is missing a valid deployment SHA marker.' >&2
            exit 1
          fi

          echo "Deploy user: $(id -un)"
          echo "Application directory: ${APP_DIR}"
          echo "Current release: ${current_target}"
          stat -c "Owner: %U:%G, permissions: %A" "${APP_DIR}"
          echo "Remote uptime:"
          uptime
          echo "Remote memory:"
          if command -v free >/dev/null 2>&1; then
            free -h
          else
            echo "free command is unavailable; continuing without memory summary."
          fi
          echo "Remote disk space:"
          df -h "${APP_DIR}"
          echo "Remote inode usage:"
          df -i "${APP_DIR}"
          REMOTE

      # HARD GATE: no production migration and no atomic switch may start
      # unless a human has verified, on the Tencent Cloud CynosDB console,
      # that a recent automatic backup exists and PITR is enabled for THIS exact
      # release SHA. schemaVersion=1 ALSO requires a real restore drill.
      # schemaVersion=2 waives ONLY that drill, and is accepted only when this
      # workflow is explicitly re-triggered with restore_drill_waiver=approved
      # AND the host attestation carries a named, recent, written approval
      # bound to the exact deployed SHA. schemaVersion=3 is the narrowest door:
      # an explicit, one-off, exact-SHA risk acceptance for a release whose owner
      # accepts that NO independent backup/PITR verification and NO restore drill
      # were performed (the attestation must NOT assert any backup/PITR fact).
      # All three paths are reachable ONLY via an explicit workflow_dispatch;
      # push events always fall back to the strict path, so the first automatic
      # deployment after a merge is safely blocked until the attestation is ready.
      # The host-side attestation is strictly read-only and contains no
      # credentials. This step runs for BOTH `full` and `skip-db` modes:
      # skip-db is not an escape hatch.
      - name: Require a verified recoverable production database backup
        id: backup_gate
        timeout-minutes: 10
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          BACKUP_ATTESTATION_FILE: ${{ vars.PRODUCTION_BACKUP_ATTESTATION_FILE }}
          DEPLOY_SHA: ${{ github.sha }}
          RESTORE_DRILL_WAIVER_MODE: ${{ inputs.restore_drill_waiver || 'none' }}
          RISK_ACCEPTANCE_MODE: ${{ inputs.risk_acceptance || 'none' }}
        run: |
          set -euo pipefail

          echo "===== [backup-gate] Hard pre-deployment gate ====="
          gate_file="${BACKUP_ATTESTATION_FILE:-/home/apps/easonfansclub/shared/.backup-verification.json}"
          [[ "$gate_file" =~ ^/[A-Za-z0-9._/-]+\.json$ ]] || {
            echo "::error::Backup attestation path is invalid."
            exit 1
          }
          [[ -s "${RUNNER_TEMP}/easonfansclub_deploy_key" && -s "${HOME}/.ssh/known_hosts" ]] || {
            echo "::error::Strict deployment SSH credentials were not prepared."
            exit 1
          }
          [[ -f scripts/production-backup-gate.mjs ]] || {
            echo "::error::Backup gate script is missing from the reviewed source."
            exit 1
          }
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid deploy SHA for the backup gate."
            exit 1
          }
          case "${RESTORE_DRILL_WAIVER_MODE}" in
            none) echo "RESTORE_DRILL_WAIVER_MODE=NONE (strict restore-drill requirement)" ;;
            approved) echo "RESTORE_DRILL_WAIVER_MODE=APPROVED (one-off, exact-SHA written approval required)" ;;
            *) echo "::error::Invalid restore drill waiver mode."; exit 1 ;;
          esac
          case "${RISK_ACCEPTANCE_MODE}" in
            none) echo "RISK_ACCEPTANCE_MODE=NONE (no backup/PITR/drill verification required to be waived)" ;;
            approved) echo "RISK_ACCEPTANCE_MODE=APPROVED (one-off, exact-SHA written risk acceptance required)" ;;
            *) echo "::error::Invalid risk acceptance mode."; exit 1 ;;
          esac
          if [[ "${RISK_ACCEPTANCE_MODE}" == approved && "${RESTORE_DRILL_WAIVER_MODE}" != none ]]; then
            echo "::error::Schema v3 risk acceptance cannot be combined with a separate restore-drill waiver."
            exit 1
          fi

          remote_host="${SERVER_USER}@${SERVER_HOST}"
          # Preflight is read-only. Schema v3 is consumed only inside the final
          # deploy script after its server lock and live-SHA compare-and-swap.
          printf -v remote_command \
            'test -f /home/apps/easonfansclub/.deploy.lock && test ! -L /home/apps/easonfansclub/.deploy.lock || exit 1; exec 9<>/home/apps/easonfansclub/.deploy.lock; flock -n 9 || { echo SERVER_DEPLOY_LOCK_BUSY; exit 1; }; current_target="$(readlink -f -- /home/apps/easonfansclub/current)" || exit 1; case "$current_target" in /home/apps/easonfansclub/releases/*) ;; *) echo PRODUCTION_CURRENT_OUTSIDE_RELEASES; exit 1 ;; esac; test -s "$current_target/.deployed-sha" || exit 1; production_sha="$(tr -d "[:space:]" < "$current_target/.deployed-sha")"; [[ "$production_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1; echo "BACKUP_GATE_PRODUCTION_SHA=$production_sha"; node --input-type=module - --cli verify --attestation %q --deploy-sha %q --waiver-mode %q --risk-acceptance-mode %q' \
            "$gate_file" "$DEPLOY_SHA" "$RESTORE_DRILL_WAIVER_MODE" "$RISK_ACCEPTANCE_MODE"

          set +e
          gate_output="$(timeout --foreground --signal=TERM --kill-after=10s 90s \
            ssh -T \
              -p "${SERVER_PORT}" \
              -i "${RUNNER_TEMP}/easonfansclub_deploy_key" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o PreferredAuthentications=publickey \
              -o PasswordAuthentication=no \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
              -o GlobalKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 \
              "${remote_host}" "${remote_command}" \
            < scripts/production-backup-gate.mjs 2>&1)"
          gate_status=$?
          set -e
          printf '%s\n' "${gate_output}"

          if [[ "${gate_status}" -ne 0 ]]; then
            echo "::error::Production backup gate rejected this deployment (exit ${gate_status})."
            exit "${gate_status}"
          fi
          if ! printf '%s\n' "${gate_output}" | grep -Fxq 'BACKUP_GATE=VERIFIED'; then
            echo "::error::Backup gate did not emit an explicit VERIFIED result."
            exit 1
          fi
          if [[ "${RESTORE_DRILL_WAIVER_MODE}" == approved ]]; then
            # A drill waiver must never be misreported as a verified restore drill.
            if ! printf '%s\n' "${gate_output}" | grep -Fxq 'RESTORE_DRILL_WAIVED=YES' ||
               ! printf '%s\n' "${gate_output}" | grep -Fxq 'RESTORE_DRILL_VERIFIED=NO'; then
              echo "::error::An approved drill waiver must explicitly report that the restore drill was NOT verified."
              exit 1
            fi
          fi
          if [[ "${RISK_ACCEPTANCE_MODE}" == approved ]]; then
            # Risk acceptance must be an actual schema v3 proof for this exact SHA.
            if ! printf '%s\n' "${gate_output}" | grep -Fxq 'BACKUP_GATE_SCHEMA_VERSION=3' ||
               ! printf '%s\n' "${gate_output}" | grep -Fxq "BACKUP_ATTESTATION_TARGET_SHA=${DEPLOY_SHA}" ||
               ! printf '%s\n' "${gate_output}" | grep -Fxq 'RISK_ACCEPTED=YES' ||
               ! printf '%s\n' "${gate_output}" | grep -Fxq 'BACKUP_VERIFIED=NO' ||
               ! printf '%s\n' "${gate_output}" | grep -Fxq 'BACKUP_PITR_VERIFIED=NO'; then
              echo "::error::Schema v3 risk acceptance must match this SHA and report unverified backup/PITR."
              exit 1
            fi
            if printf '%s\n' "${gate_output}" | grep -Eq '^BACKUP_ID='; then
              echo "::error::Risk acceptance must not assert a backup id; fabrication is rejected."
              exit 1
            fi
          fi
          production_sha="$(printf '%s\n' "${gate_output}" | sed -n 's/^BACKUP_GATE_PRODUCTION_SHA=//p' | tail -n 1)"
          [[ "${production_sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Locked preflight did not return the live production SHA."
            exit 1
          }
          echo "production_sha=${production_sha}" >> "${GITHUB_OUTPUT}"
          echo "BACKUP_GATE_STEP=PASS"
          echo "verified_sha=${DEPLOY_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Deploy exact commit from server Git
        id: deploy
        timeout-minutes: 45
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          APP_DIR: ${{ env.APP_DIR }}
          APP_PORT: ${{ env.APP_PORT }}
          DEPLOY_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PM2_APP_NAME: easonfansclub
          TOPIC_LOTTERY_MIGRATION_APPROVAL_FILE: ${{ vars.TOPIC_LOTTERY_MIGRATION_APPROVAL_FILE }}
          DEPLOY_DB_MODE: ${{ inputs.db_mode || 'full' }}
          # Server-side defence in depth: deploy-production-git.sh refuses any
          # migration/switch unless this exact SHA passed the backup gate.
          BACKUP_GATE_VERIFIED_SHA: ${{ steps.backup_gate.outputs.verified_sha }}
          EXPECTED_PRODUCTION_SHA: ${{ steps.backup_gate.outputs.production_sha }}
          BACKUP_GATE_ATTESTATION_FILE: ${{ vars.PRODUCTION_BACKUP_ATTESTATION_FILE }}
          BACKUP_GATE_RESTORE_DRILL_WAIVER_MODE: ${{ inputs.restore_drill_waiver || 'none' }}
          BACKUP_GATE_RISK_ACCEPTANCE_MODE: ${{ inputs.risk_acceptance || 'none' }}
          BACKUP_GATE_RUN_ID: ${{ github.run_id }}
          BACKUP_GATE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          deploy_db_mode="${DEPLOY_DB_MODE:-full}"
          case "${deploy_db_mode}" in
            full|skip-db) ;;
            *) echo "::error::Unknown database deployment mode."; exit 2 ;;
          esac

          # Only forward a server-side path; approval contents stay on the host.
          # Restrict shell metacharacters because SSH joins remote arguments.
          if [[ -n "${TOPIC_LOTTERY_MIGRATION_APPROVAL_FILE}" ]] &&
             [[ ! "${TOPIC_LOTTERY_MIGRATION_APPROVAL_FILE}" =~ ^/[A-Za-z0-9._/-]+\.json$ ||
                "/${TOPIC_LOTTERY_MIGRATION_APPROVAL_FILE}/" == *"/../"* ]]; then
            echo "::error::Lottery approval path must be a safe absolute .json path."
            exit 1
          fi

          backup_gate_file="${BACKUP_GATE_ATTESTATION_FILE:-/home/apps/easonfansclub/shared/.backup-verification.json}"
          backup_gate_restore_mode="${BACKUP_GATE_RESTORE_DRILL_WAIVER_MODE:-none}"
          backup_gate_risk_mode="${BACKUP_GATE_RISK_ACCEPTANCE_MODE:-none}"
          case "${backup_gate_restore_mode}" in none|approved) ;; *) echo "::error::Invalid backup-gate restore-drill mode."; exit 1 ;; esac
          case "${backup_gate_risk_mode}" in none|approved) ;; *) echo "::error::Invalid backup-gate risk-acceptance mode."; exit 1 ;; esac
          if [[ ! "${backup_gate_file}" =~ ^/[A-Za-z0-9._/-]+\.json$ ]]; then
            echo "::error::Backup attestation path must be a safe absolute JSON file."
            exit 1
          fi
          if [[ "${backup_gate_risk_mode}" == approved ]]; then
            [[ "${backup_gate_file}" =~ ^/home/apps/easonfansclub/shared/[A-Za-z0-9._/-]+\.json$ &&
               "/${backup_gate_file}/" != *"/../"* ]] || { echo "::error::Schema v3 attestation path must stay inside the protected shared directory."; exit 1; }
            [[ "${backup_gate_restore_mode}" == none ]] || { echo "::error::Schema v3 risk acceptance cannot be combined with a restore-drill waiver."; exit 1; }
            [[ "${BACKUP_GATE_RUN_ID:-}" =~ ^[1-9][0-9]{0,19}$ ]] || { echo "::error::Invalid deployment run ID."; exit 1; }
            [[ "${BACKUP_GATE_RUN_ATTEMPT:-}" =~ ^[1-9][0-9]{0,5}$ ]] || { echo "::error::Invalid deployment run attempt."; exit 1; }
          fi

          REMOTE_HOST="${SERVER_USER}@${SERVER_HOST}"
          SSH_OPTIONS=(
            -i "${RUNNER_TEMP}/easonfansclub_deploy_key"
            -p "${SERVER_PORT}"
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o ConnectionAttempts=3
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=20
            -o TCPKeepAlive=yes
            -o StrictHostKeyChecking=yes
          )

          echo "===== [deploy] Verify SSH connectivity ====="
          timeout --foreground 60s ssh "${SSH_OPTIONS[@]}" "${REMOTE_HOST}" "echo SSH_OK"

          echo "===== [deploy] Deploy exact SHA from the server-side Git cache ====="
          echo "Deploy SHA: ${DEPLOY_SHA}"
          echo "This path transfers only the deployment script over SSH; source and dependencies stay on the server."
          expected_production_sha="${EXPECTED_PRODUCTION_SHA:-}"
          [[ "$expected_production_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid locked preflight production SHA." >&2; exit 1; }
          deploy_arguments=("${APP_DIR}" "${APP_PORT}" "${DEPLOY_SHA}" "${PM2_APP_NAME}" "${GITHUB_REPOSITORY}" "${expected_production_sha}")
          if [[ "${deploy_db_mode}" == skip-db ]]; then
            deploy_arguments+=(--skip-db)
            echo "DATABASE_DEPLOYMENT_MODE=SKIP_DB"
          else
            echo "DATABASE_DEPLOYMENT_MODE=FULL"
          fi
          set +e
          deploy_output="$(cat scripts/deploy-safety.sh scripts/deploy-production-git.sh \
            | timeout --foreground --signal=TERM --kill-after=7m 35m ssh "${SSH_OPTIONS[@]}" "${REMOTE_HOST}" \
              env "TOPIC_LOTTERY_MIGRATION_APPROVAL_FILE=${TOPIC_LOTTERY_MIGRATION_APPROVAL_FILE}" \
                  "BACKUP_GATE_VERIFIED_SHA=${BACKUP_GATE_VERIFIED_SHA:-}" \
                  "BACKUP_GATE_ATTESTATION_FILE=${backup_gate_file}" \
                  "BACKUP_GATE_RESTORE_DRILL_WAIVER_MODE=${backup_gate_restore_mode}" \
                  "BACKUP_GATE_RISK_ACCEPTANCE_MODE=${backup_gate_risk_mode}" \
                  "BACKUP_GATE_RUN_ID=${BACKUP_GATE_RUN_ID:-}" \
                  "BACKUP_GATE_RUN_ATTEMPT=${BACKUP_GATE_RUN_ATTEMPT:-}" \
              bash -s -- "${deploy_arguments[@]}")"
          deploy_status=$?
          set -e
          printf '%s\n' "${deploy_output}"
          candidate_release="$(printf '%s\n' "${deploy_output}" | sed -n 's/^DEPLOY_CANDIDATE_RELEASE=//p' | tail -n 1)"
          if [[ "${candidate_release}" =~ ^/home/apps/easonfansclub/releases/[^/]+$ ]]; then
            echo "candidate_release=${candidate_release}" >> "${GITHUB_OUTPUT}"
          fi
          exit "${deploy_status}"

      - name: Verify public website
        id: public_health
        timeout-minutes: 5
        env:
          PRODUCTION_DOMAIN: ${{ env.PRODUCTION_DOMAIN }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          public_url="https://${PRODUCTION_DOMAIN}/api/health/live"
          for attempt in 1 2 3 4 5; do
            response="$(curl --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 20 "${public_url}" 2>/dev/null || true)"
            if printf '%s' "${response}" | node -e '
              let raw = "";
              process.stdin.on("data", chunk => raw += chunk);
              process.stdin.on("end", () => {
                try { process.exit(JSON.parse(raw).release === process.argv[1] ? 0 : 1); }
                catch { process.exit(1); }
              });
            ' "${DEPLOY_SHA}"; then
              echo "Public health check verified release ${DEPLOY_SHA} at ${public_url}."
              exit 0
            fi
            sleep 3
          done

          echo "::error::Public health did not serve the exact candidate SHA ${DEPLOY_SHA} over HTTPS or HTTP."
          exit 1

      - name: Guarded rollback after deploy or public-health failure
        id: rollback
        if: ${{ always() && steps.deploy.outcome != 'skipped' && steps.deploy.outputs.candidate_release != '' && (steps.deploy.outcome != 'success' || steps.public_health.outcome != 'success') }}
        timeout-minutes: 16
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          APP_DIR: ${{ env.APP_DIR }}
          APP_PORT: ${{ env.APP_PORT }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_CANDIDATE_RELEASE: ${{ steps.deploy.outputs.candidate_release }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PM2_APP_NAME: easonfansclub
        run: |
          set -euo pipefail

          REMOTE_HOST="${SERVER_USER}@${SERVER_HOST}"
          SSH_OPTIONS=(
            -i "${RUNNER_TEMP}/easonfansclub_deploy_key"
            -p "${SERVER_PORT}"
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o ConnectionAttempts=3
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=20
            -o TCPKeepAlive=yes
            -o StrictHostKeyChecking=yes
          )

          rollback_output="$(cat scripts/deploy-safety.sh scripts/rollback-production-git.sh \
            | timeout --foreground --signal=TERM --kill-after=60s 14m ssh "${SSH_OPTIONS[@]}" "${REMOTE_HOST}" \
              bash -s -- "${APP_DIR}" "${DEPLOY_SHA}" "${DEPLOY_CANDIDATE_RELEASE}" "${PM2_APP_NAME}" "${GITHUB_REPOSITORY}" "${APP_PORT}")"
          printf '%s\n' "${rollback_output}"
          verified_sha="$(printf '%s\n' "${rollback_output}" | sed -n 's/^ROLLBACK_VERIFIED_SHA=//p' | tail -n 1)"
          rollback_result="$(printf '%s\n' "${rollback_output}" | sed -n 's/^ROLLBACK_RESULT=//p' | tail -n 1)"
          if [[ ! "${verified_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Rollback did not return a verifiable active SHA."
            exit 1
          fi
          echo "verified_sha=${verified_sha}" >> "${GITHUB_OUTPUT}"
          echo "result=${rollback_result}" >> "${GITHUB_OUTPUT}"

      - name: Verify public SHA after guarded rollback
        if: ${{ always() && steps.rollback.outcome == 'success' }}
        timeout-minutes: 5
        env:
          PRODUCTION_DOMAIN: ${{ env.PRODUCTION_DOMAIN }}
          DEPLOY_SHA: ${{ steps.rollback.outputs.verified_sha }}
        run: |
          set -euo pipefail
          public_url="https://${PRODUCTION_DOMAIN}/api/health/live"
          for attempt in 1 2 3 4 5; do
            response="$(curl --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 20 "${public_url}" 2>/dev/null || true)"
            if printf '%s' "${response}" | node -e '
              let raw = "";
              process.stdin.on("data", chunk => raw += chunk);
              process.stdin.on("end", () => {
                try { process.exit(JSON.parse(raw).release === process.argv[1] ? 0 : 1); }
                catch { process.exit(1); }
              });
            ' "${DEPLOY_SHA}"; then
              echo "Public endpoint now serves verified active SHA ${DEPLOY_SHA}."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Public endpoint does not serve rollback SHA ${DEPLOY_SHA}."
          exit 1
