name: Deploy to Tencent Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  APP_DIR: /home/apps/easonfansclub
  APP_PORT: "3000"
  PACKAGE_NAME: easonfansclub-${{ github.sha }}.tar.gz
  MAX_PACKAGE_BYTES: "52428800"

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[infra-only]')
    name: Deploy production
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Validate deployment secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail

          for secret_name in SERVER_HOST SERVER_USER SERVER_PORT SERVER_SSH_KEY; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Required repository secret ${secret_name} is missing or empty."
              exit 1
            fi
          done

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare deploy package
        run: |
          set -euo pipefail

          echo "===== [package 1/4] Build production source manifest ====="
          mkdir -p .deploy
          git archive \
            --format=tar.gz \
            --output=".deploy/${PACKAGE_NAME}" \
            "${GITHUB_SHA}" \
            -- \
            app \
            components \
            hooks \
            lib \
            prisma \
            public \
            types \
            server.ts \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            next.config.ts \
            tsconfig.json \
            next-env.d.ts \
            middleware.ts \
            postcss.config.js \
            tailwind.config.ts \
            eslint.config.mjs

          echo "===== [package 2/4] Validate archive ====="
          test -s ".deploy/${PACKAGE_NAME}"
          tar -tzf ".deploy/${PACKAGE_NAME}" > .deploy/package-contents.txt
          for required_path in app components lib prisma public server.ts package.json pnpm-lock.yaml; do
            if ! grep -Eq "^${required_path}(/|$)" .deploy/package-contents.txt; then
              echo "::error::Required production path is missing from deploy package: ${required_path}"
              exit 1
            fi
          done
          if grep -Eq '(^|/)(node_modules|\.git|tests|\.next/cache)(/|$)|(^|/)\.env($|\.)|\.log$' .deploy/package-contents.txt; then
            echo "::error::Deploy package contains a forbidden development or temporary file."
            grep -E '(^|/)(node_modules|\.git|tests|\.next/cache)(/|$)|(^|/)\.env($|\.)|\.log$' .deploy/package-contents.txt
            exit 1
          fi
          package_bytes="$(stat -c '%s' ".deploy/${PACKAGE_NAME}")"
          package_files="$(wc -l < .deploy/package-contents.txt | tr -d ' ')"
          package_mib="$(awk -v bytes="${package_bytes}" 'BEGIN { printf "%.2f", bytes / 1048576 }')"
          if [ "${package_bytes}" -gt "${MAX_PACKAGE_BYTES}" ]; then
            echo "::error::Deploy package is ${package_mib} MiB, exceeding the 50 MiB safety limit."
            exit 1
          fi

          echo "===== [package 3/4] Create checksum ====="
          (
            cd .deploy
            sha256sum "${PACKAGE_NAME}" > "${PACKAGE_NAME}.sha256"
          )

          echo "===== [package 4/4] Package summary ====="
          echo "Archive: ${PACKAGE_NAME}"
          echo "Files: ${package_files}"
          echo "Size: ${package_bytes} bytes (${package_mib} MiB)"
          echo "SHA256: $(cut -d ' ' -f 1 ".deploy/${PACKAGE_NAME}.sha256")"
          echo "PACKAGE_BYTES=${package_bytes}" >> "${GITHUB_ENV}"
          echo "PACKAGE_MIB=${package_mib}" >> "${GITHUB_ENV}"

      - name: Check server connection and directory permissions
        uses: appleboy/ssh-action@v1
        env:
          APP_DIR: ${{ env.APP_DIR }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: APP_DIR
          command_timeout: 2m
          script: |
            set -euo pipefail

            mkdir -p "${APP_DIR}/.deploy-incoming"
            test -d "${APP_DIR}"
            test -w "${APP_DIR}"
            test -w "${APP_DIR}/.deploy-incoming"

            echo "Deploy user: $(id -un)"
            echo "Application directory: ${APP_DIR}"
            stat -c "Owner: %U:%G, permissions: %A" "${APP_DIR}"
            echo "Remote uptime:"
            uptime
            echo "Remote memory:"
            if command -v free >/dev/null 2>&1; then
              free -h
            else
              echo "free command is unavailable; continuing without memory summary."
            fi
            echo "Remote disk space:"
            df -h "${APP_DIR}"
            echo "Remote inode usage:"
            df -i "${APP_DIR}"
            if command -v rsync >/dev/null 2>&1; then
              echo "Remote rsync: $(command -v rsync)"
            else
              echo "Remote rsync: unavailable; upload step will use scp fallback."
            fi

      - name: Configure deployment SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail

          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SERVER_SSH_KEY}" \
            | tr -d '\r' \
            > "${RUNNER_TEMP}/easonfansclub_deploy_key"
          chmod 600 "${RUNNER_TEMP}/easonfansclub_deploy_key"

          echo "===== [ssh] Register Tencent Cloud host key ====="
          timeout 30s ssh-keyscan \
            -T 15 \
            -p "${SERVER_PORT}" \
            -H "${SERVER_HOST}" \
            >> "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Upload deploy package
        timeout-minutes: 30
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          echo "===== [upload 1/6] Prepare resumable upload ====="
          ARCHIVE=".deploy/${PACKAGE_NAME}"
          CHECKSUM_FILE="${ARCHIVE}.sha256"
          REMOTE_HOST="${SERVER_USER}@${SERVER_HOST}"
          REMOTE_DIR="${APP_DIR}/.deploy-incoming"
          REMOTE_ARCHIVE="${REMOTE_DIR}/${PACKAGE_NAME}"
          REMOTE_ARCHIVE_PART="${REMOTE_ARCHIVE}.part"
          REMOTE_CHECKSUM="${REMOTE_DIR}/${PACKAGE_NAME}.sha256"
          REMOTE_CHECKSUM_PART="${REMOTE_CHECKSUM}.part"
          UPLOAD_ATTEMPTS=3
          LOCAL_SHA256="$(awk 'NR == 1 { print $1; exit }' "${CHECKSUM_FILE}")"

          if ! command -v rsync >/dev/null 2>&1; then
            echo "Runner rsync: unavailable; upload step will use scp fallback."
            RUNNER_RSYNC_AVAILABLE=false
          else
            echo "Runner rsync: $(command -v rsync)"
            RUNNER_RSYNC_AVAILABLE=true
          fi
          command -v timeout >/dev/null 2>&1
          if [[ ! "${LOCAL_SHA256}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Local deploy package checksum is missing or malformed."
            exit 1
          fi

          ls -lh "${ARCHIVE}"
          du -h "${ARCHIVE}"
          echo "Archive size: ${PACKAGE_BYTES} bytes (${PACKAGE_MIB} MiB)"
          echo "Local SHA256: ${LOCAL_SHA256}"
          echo "Upload destination: ${REMOTE_HOST}:${REMOTE_DIR}/"

          SSH_OPTIONS=(
            -i "${RUNNER_TEMP}/easonfansclub_deploy_key" \
            -p "${SERVER_PORT}" \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            -o StrictHostKeyChecking=yes \
          )

          echo "===== [upload 2/6] Check SSH connectivity ====="
          timeout --foreground 60s ssh "${SSH_OPTIONS[@]}" "${REMOTE_HOST}" "echo SSH_OK"

          echo "===== [upload 3/6] Select upload transport ====="
          REMOTE_RSYNC_AVAILABLE="$(
            timeout --foreground 60s ssh "${SSH_OPTIONS[@]}" "${REMOTE_HOST}" \
              'if command -v rsync >/dev/null 2>&1; then printf yes; else printf no; fi'
          )"
          if [ "${RUNNER_RSYNC_AVAILABLE}" = true ] && [ "${REMOTE_RSYNC_AVAILABLE}" = yes ]; then
            USE_RSYNC=true
            TRANSPORT=rsync
            echo "Using rsync with partial resume and progress reporting."
          else
            USE_RSYNC=false
            TRANSPORT=scp
            echo "Using scp fallback with bounded retries."
          fi

          RSYNC_SSH_COMMAND="ssh -i ${RUNNER_TEMP}/easonfansclub_deploy_key -p ${SERVER_PORT} -o BatchMode=yes -o ConnectTimeout=30 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o StrictHostKeyChecking=yes"
          UPLOAD_START=$(date +%s)
          echo "Upload started at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          upload_once() {
            local archive_exit=1
            local checksum_exit=1

            if [ "${USE_RSYNC}" = true ]; then
              if rsync \
                --archive \
                --partial \
                --inplace \
                --append-verify \
                --human-readable \
                --info=progress2 \
                --timeout=120 \
                -e "${RSYNC_SSH_COMMAND}" \
                "${ARCHIVE}" \
                "${REMOTE_HOST}:${REMOTE_ARCHIVE_PART}"; then
                archive_exit=0
              else
                archive_exit=$?
              fi

              if [ "${archive_exit}" -eq 0 ]; then
                if rsync \
                  --archive \
                  --partial \
                  --inplace \
                  --append-verify \
                  --human-readable \
                  --info=progress2 \
                  --timeout=120 \
                  -e "${RSYNC_SSH_COMMAND}" \
                  "${CHECKSUM_FILE}" \
                  "${REMOTE_HOST}:${REMOTE_CHECKSUM_PART}"; then
                  checksum_exit=0
                else
                  checksum_exit=$?
                fi
              fi
            else
              if scp \
                -i "${RUNNER_TEMP}/easonfansclub_deploy_key" \
                -P "${SERVER_PORT}" \
                -o BatchMode=yes \
                -o ConnectTimeout=30 \
                -o ConnectionAttempts=3 \
                -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=20 \
                -o TCPKeepAlive=yes \
                -o StrictHostKeyChecking=yes \
                "${ARCHIVE}" \
                "${REMOTE_HOST}:${REMOTE_ARCHIVE_PART}"; then
                archive_exit=0
              else
                archive_exit=$?
              fi

              if [ "${archive_exit}" -eq 0 ]; then
                if scp \
                  -i "${RUNNER_TEMP}/easonfansclub_deploy_key" \
                  -P "${SERVER_PORT}" \
                  -o BatchMode=yes \
                  -o ConnectTimeout=30 \
                  -o ConnectionAttempts=3 \
                  -o ServerAliveInterval=15 \
                  -o ServerAliveCountMax=20 \
                  -o TCPKeepAlive=yes \
                  -o StrictHostKeyChecking=yes \
                  "${CHECKSUM_FILE}" \
                  "${REMOTE_HOST}:${REMOTE_CHECKSUM_PART}"; then
                  checksum_exit=0
                else
                  checksum_exit=$?
                fi
              fi
            fi

            if [ "${archive_exit}" -eq 0 ] && [ "${checksum_exit}" -eq 0 ]; then
              return 0
            fi

            echo "Upload attempt failed (archive=${archive_exit}, checksum=${checksum_exit})."
            return 1
          }

          upload_succeeded=false
          ATTEMPTS_USED=0
          for attempt in $(seq 1 "${UPLOAD_ATTEMPTS}"); do
            ATTEMPTS_USED="${attempt}"
            attempt_start=$(date +%s)
            attempt_started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "===== Upload attempt ${attempt}/${UPLOAD_ATTEMPTS} ====="
            echo "Transport: ${TRANSPORT}"
            echo "Started: ${attempt_started_at}"
            if upload_once; then
              upload_succeeded=true
              break
            fi

            echo "Upload attempt ${attempt}/${UPLOAD_ATTEMPTS} failed"
            echo "Elapsed: $(( $(date +%s) - attempt_start )) seconds"
            if [ "${attempt}" -lt "${UPLOAD_ATTEMPTS}" ]; then
              backoff_seconds=$((10 * attempt))
              echo "Retrying in ${backoff_seconds} seconds; resumable partial files are preserved."
              sleep "${backoff_seconds}"
            fi
          done

          UPLOAD_END=$(date +%s)
          if [ "${upload_succeeded}" != true ]; then
            echo "::error::Upload failed after ${UPLOAD_ATTEMPTS} attempts."
            echo "Upload failed at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Upload elapsed: $((UPLOAD_END - UPLOAD_START)) seconds"
            exit 1
          fi

          echo "===== [upload 4/6] Verify remote SHA256 ====="
          REMOTE_SHA256="$(
            timeout --foreground 60s ssh "${SSH_OPTIONS[@]}" "${REMOTE_HOST}" \
              "test -s '${REMOTE_ARCHIVE_PART}' && sha256sum -- '${REMOTE_ARCHIVE_PART}' | awk '{print \$1}'"
          )"
          echo "Remote partial SHA256: ${REMOTE_SHA256}"
          if [ "${LOCAL_SHA256}" != "${REMOTE_SHA256}" ]; then
            echo "::error::SHA256 mismatch: local=${LOCAL_SHA256}, remote=${REMOTE_SHA256}"
            echo "Upload failed after $((UPLOAD_END - UPLOAD_START)) seconds."
            exit 1
          fi

          echo "===== [upload 5/6] Promote verified package ====="
          timeout --foreground 60s ssh "${SSH_OPTIONS[@]}" "${REMOTE_HOST}" \
            "set -e; mv -f -- '${REMOTE_CHECKSUM_PART}' '${REMOTE_CHECKSUM}'; mv -f -- '${REMOTE_ARCHIVE_PART}' '${REMOTE_ARCHIVE}'"

          echo "===== [upload 6/6] Confirm promoted package ====="
          REMOTE_FINAL_SHA256="$(
            timeout --foreground 60s ssh "${SSH_OPTIONS[@]}" "${REMOTE_HOST}" \
              "sha256sum -- '${REMOTE_ARCHIVE}' | awk '{print \$1}'"
          )"
          if [ "${LOCAL_SHA256}" != "${REMOTE_FINAL_SHA256}" ]; then
            echo "::error::Promoted package SHA256 mismatch: local=${LOCAL_SHA256}, remote=${REMOTE_FINAL_SHA256}"
            echo "Upload failed after $(( $(date +%s) - UPLOAD_START )) seconds."
            exit 1
          fi

          echo "Remote final SHA256: ${REMOTE_FINAL_SHA256}"
          echo "Upload completed"
          echo "Transport: ${TRANSPORT}"
          echo "Attempts used: ${ATTEMPTS_USED}"
          echo "Elapsed: $(( $(date +%s) - UPLOAD_START )) seconds"
          echo "Local SHA256: ${LOCAL_SHA256}"
          echo "Remote SHA256: ${REMOTE_FINAL_SHA256}"
          echo "SHA256_OK"
          echo "Upload finished at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Install, migrate, build, and restart
        uses: appleboy/ssh-action@v1
        env:
          APP_DIR: ${{ env.APP_DIR }}
          APP_PORT: ${{ env.APP_PORT }}
          PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: APP_DIR,APP_PORT,PACKAGE_NAME,DEPLOY_SHA
          command_timeout: 35m
          script: |
            set -euo pipefail

            log_step() {
              printf '\n===== [deploy %s] %s =====\n' "$1" "$2"
            }

            log_step "1/8" "Load production runtime"
            export NVM_DIR="${HOME}/.nvm"
            if [ -s "${NVM_DIR}/nvm.sh" ]; then
              . "${NVM_DIR}/nvm.sh"
            fi

            command -v node
            command -v pnpm
            command -v pm2

            log_step "2/8" "Verify uploaded package"
            incoming_dir="${APP_DIR}/.deploy-incoming"
            cd "${incoming_dir}"
            echo "Remote package size: $(stat -c '%s bytes' "${PACKAGE_NAME}")"
            sha256sum -c "${PACKAGE_NAME}.sha256"

            log_step "3/8" "Extract source into existing application directory"
            cd "${APP_DIR}"
            tar -xzf "${incoming_dir}/${PACKAGE_NAME}"
            printf '%s\n' "${DEPLOY_SHA}" > .deployed-sha

            test -f .env
            test -f package.json
            test -f pnpm-lock.yaml
            test -f server.ts

            if ! grep -Eq '^TRUSTED_CLIENT_IP_SOURCE=("nginx"|nginx|"cloudflare"|cloudflare)[[:space:]]*$' .env; then
              echo 'Production .env must set TRUSTED_CLIENT_IP_SOURCE=nginx or cloudflare to match the active trusted proxy boundary.' >&2
              exit 1
            fi

            node -v
            pnpm -v
            pm2 -v

            log_step "4/8" "Install production dependencies"
            install_started="$(date +%s)"
            pnpm install --frozen-lockfile
            test -d node_modules
            echo "Dependency install completed in $(( $(date +%s) - install_started ))s."

            log_step "5/8" "Apply existing migrations and generate Prisma client"
            pnpm prisma migrate deploy
            pnpm prisma generate

            log_step "6/8" "Build Next.js production bundle"
            build_started="$(date +%s)"
            pnpm build
            echo "Build completed successfully in $(( $(date +%s) - build_started ))s."

            log_step "7/8" "Restart PM2 application"
            pm2 restart easonfansclub --update-env
            echo "PM2 restart command completed successfully."

            rm -f "${incoming_dir:?}/${PACKAGE_NAME}" \
              "${incoming_dir:?}/${PACKAGE_NAME}.sha256"

            log_step "8/8" "Run local health check"
            for attempt in $(seq 1 10); do
              if curl --fail --silent --show-error \
                --max-time 10 \
                "http://127.0.0.1:${APP_PORT}/login" > /dev/null; then
                break
              fi

              if [ "${attempt}" -eq 10 ]; then
                echo "Application health check failed after ${attempt} attempts."
                pm2 logs easonfansclub --lines 80 --nostream
                exit 1
              fi

              sleep 3
            done

            test "$(cat .deployed-sha)" = "${DEPLOY_SHA}"
            pm2 describe easonfansclub
            if ! ss -ltn | grep -Eq "[[:space:]](127\\.0\\.0\\.1|\\[::1\\]):${APP_PORT}[[:space:]]"; then
              echo 'Application port must be bound to localhost behind Nginx.' >&2
              exit 1
            fi
            echo "Deployment health check passed for ${DEPLOY_SHA}."

      - name: Verify public website
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail

          for public_url in \
            "https://${SERVER_HOST}/login" \
            "http://${SERVER_HOST}/login"; do
            if curl --insecure \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 3 \
              --connect-timeout 10 \
              --max-time 20 \
              "${public_url}" > /dev/null; then
              echo "Public website health check passed: ${public_url}"
              exit 0
            fi
          done

          echo "::error::The public website did not respond successfully over HTTPS or HTTP."
          exit 1
