name: Deploy to Tencent Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  APP_DIR: /home/apps/easonfansclub
  APP_PORT: "3000"
  PACKAGE_NAME: easonfansclub-${{ github.sha }}.tar.gz
  MAX_PACKAGE_BYTES: "52428800"

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[infra-only]')
    name: Deploy production
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Validate deployment secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail

          for secret_name in SERVER_HOST SERVER_USER SERVER_PORT SERVER_SSH_KEY; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Required repository secret ${secret_name} is missing or empty."
              exit 1
            fi
          done

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare deploy package
        run: |
          set -euo pipefail

          echo "===== [package 1/4] Build production source manifest ====="
          mkdir -p .deploy
          git archive \
            --format=tar.gz \
            --output=".deploy/${PACKAGE_NAME}" \
            "${GITHUB_SHA}" \
            -- \
            app \
            components \
            hooks \
            lib \
            prisma \
            public \
            types \
            server.ts \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            next.config.ts \
            tsconfig.json \
            next-env.d.ts \
            middleware.ts \
            scripts/check-migrations-mysql.ts \
            scripts/run-birthday-daily-job.sh \
            postcss.config.js \
            tailwind.config.ts \
            eslint.config.mjs \
            ecosystem.config.js

          echo "===== [package 2/4] Validate archive ====="
          test -s ".deploy/${PACKAGE_NAME}"
          tar -tzf ".deploy/${PACKAGE_NAME}" > .deploy/package-contents.txt
          for required_path in app components lib prisma public server.ts package.json pnpm-lock.yaml ecosystem.config.js scripts/check-migrations-mysql.ts scripts/run-birthday-daily-job.sh; do
            if ! grep -Eq "^${required_path}(/|$)" .deploy/package-contents.txt; then
              echo "::error::Required production path is missing from deploy package: ${required_path}"
              exit 1
            fi
          done
          if grep -Eq '(^|/)(node_modules|\.git|tests|\.next/cache)(/|$)|(^|/)\.env($|\.)|\.log$' .deploy/package-contents.txt; then
            echo "::error::Deploy package contains a forbidden development or temporary file."
            grep -E '(^|/)(node_modules|\.git|tests|\.next/cache)(/|$)|(^|/)\.env($|\.)|\.log$' .deploy/package-contents.txt
            exit 1
          fi
          package_bytes="$(stat -c '%s' ".deploy/${PACKAGE_NAME}")"
          package_files="$(wc -l < .deploy/package-contents.txt | tr -d ' ')"
          package_mib="$(awk -v bytes="${package_bytes}" 'BEGIN { printf "%.2f", bytes / 1048576 }')"
          if [ "${package_bytes}" -gt "${MAX_PACKAGE_BYTES}" ]; then
            echo "::error::Deploy package is ${package_mib} MiB, exceeding the 50 MiB safety limit."
            exit 1
          fi

          echo "===== [package 3/4] Create checksum ====="
          (
            cd .deploy
            sha256sum "${PACKAGE_NAME}" > "${PACKAGE_NAME}.sha256"
          )

          echo "===== [package 4/4] Package summary ====="
          echo "Archive: ${PACKAGE_NAME}"
          echo "Files: ${package_files}"
          echo "Size: ${package_bytes} bytes (${package_mib} MiB)"
          echo "SHA256: $(cut -d ' ' -f 1 ".deploy/${PACKAGE_NAME}.sha256")"
          echo "PACKAGE_BYTES=${package_bytes}" >> "${GITHUB_ENV}"
          echo "PACKAGE_MIB=${package_mib}" >> "${GITHUB_ENV}"

      - name: Check server connection and directory permissions
        uses: appleboy/ssh-action@v1
        env:
          APP_DIR: ${{ env.APP_DIR }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: APP_DIR,DEPLOY_SHA
          command_timeout: 10m
          script: |
            set -euo pipefail

            mkdir -p "${APP_DIR}/.deploy-incoming"
            mkdir -p "${APP_DIR}/releases" "${APP_DIR}/shared"
            test -d "${APP_DIR}"
            test -w "${APP_DIR}"
            test -w "${APP_DIR}/.deploy-incoming"
            test -w "${APP_DIR}/releases"
            test -w "${APP_DIR}/shared"

            if [[ ! "${DEPLOY_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'DEPLOY_SHA is not a 40-character hexadecimal Git SHA.' >&2
              exit 1
            fi

            if [ ! -e "${APP_DIR}/shared/.env" ] && [ ! -L "${APP_DIR}/shared/.env" ]; then
              if [ ! -s "${APP_DIR}/.env" ]; then
                echo 'Neither shared/.env nor the legacy APP_DIR/.env exists.' >&2
                exit 1
              fi
              cp -p -- "${APP_DIR}/.env" "${APP_DIR}/shared/.env"
              echo 'Copied the legacy .env into shared/.env.'
            fi

            if [ ! -e "${APP_DIR}/current" ] && [ ! -L "${APP_DIR}/current" ]; then
              bootstrap_release="${APP_DIR}/releases/bootstrap"
              bootstrap_paths=(
                app
                components
                hooks
                lib
                prisma
                public
                types
                server.ts
                package.json
                pnpm-lock.yaml
                pnpm-workspace.yaml
                next.config.ts
                tsconfig.json
                middleware.ts
                postcss.config.js
                tailwind.config.ts
                eslint.config.mjs
              )

              if [ -e "${bootstrap_release}" ] || [ -L "${bootstrap_release}" ]; then
                echo "Bootstrap release already exists while current is missing: ${bootstrap_release}" >&2
                echo 'Refusing to overwrite a partial bootstrap release.' >&2
                exit 1
              fi

              for bootstrap_path in "${bootstrap_paths[@]}"; do
                if [ ! -e "${APP_DIR}/${bootstrap_path}" ] && [ ! -L "${APP_DIR}/${bootstrap_path}" ]; then
                  echo "Legacy deployment is missing required path: ${APP_DIR}/${bootstrap_path}" >&2
                  exit 1
                fi
              done

              install -d -m 755 "${bootstrap_release}"
              for bootstrap_path in "${bootstrap_paths[@]}"; do
                cp -a -- "${APP_DIR}/${bootstrap_path}" "${bootstrap_release}/${bootstrap_path}"
              done
              for optional_path in .next node_modules; do
                if [ -d "${APP_DIR}/${optional_path}" ]; then
                  cp -a -- "${APP_DIR}/${optional_path}" "${bootstrap_release}/${optional_path}"
                fi
              done

              ln -s -- "${APP_DIR}/shared/.env" "${bootstrap_release}/.env"
              printf '%s\n' "${DEPLOY_SHA}" > "${bootstrap_release}/.deployed-sha"
              touch "${bootstrap_release}/.bootstrap-release"
              ln -s -- "${bootstrap_release}" "${APP_DIR}/current"
              echo "Bootstrapped legacy deployment at ${bootstrap_release}."
            fi

            if [ ! -L "${APP_DIR}/current" ]; then
              echo 'Production current must be a symlink into releases/.' >&2
              echo 'Refusing to deploy into the legacy live directory.' >&2
              exit 1
            fi
            current_target="$(readlink -f -- "${APP_DIR}/current")"
            case "${current_target}" in
              "${APP_DIR}/releases/"*) ;;
              *)
                echo "Production current target is outside releases/: ${current_target}" >&2
                exit 1
                ;;
            esac
            test -r "${APP_DIR}/shared/.env"
            test -s "${APP_DIR}/shared/.env"
            test -s "${current_target}/.deployed-sha"
            if ! grep -Eq '^[0-9a-f]{40}$' "${current_target}/.deployed-sha"; then
              echo 'Current release is missing a valid deployment SHA marker.' >&2
              exit 1
            fi

            echo "Deploy user: $(id -un)"
            echo "Application directory: ${APP_DIR}"
            echo "Current release: ${current_target}"
            stat -c "Owner: %U:%G, permissions: %A" "${APP_DIR}"
            echo "Remote uptime:"
            uptime
            echo "Remote memory:"
            if command -v free >/dev/null 2>&1; then
              free -h
            else
              echo "free command is unavailable; continuing without memory summary."
            fi
            echo "Remote disk space:"
            df -h "${APP_DIR}"
            echo "Remote inode usage:"
            df -i "${APP_DIR}"
            if command -v rsync >/dev/null 2>&1; then
              echo "Remote rsync: $(command -v rsync)"
            else
              echo "Remote rsync: unavailable; upload step will use scp fallback."
            fi

      - name: Configure deployment SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail

          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SERVER_SSH_KEY}" \
            | tr -d '\r' \
            > "${RUNNER_TEMP}/easonfansclub_deploy_key"
          chmod 600 "${RUNNER_TEMP}/easonfansclub_deploy_key"

          echo "===== [ssh] Register Tencent Cloud host key ====="
          timeout 30s ssh-keyscan \
            -T 15 \
            -p "${SERVER_PORT}" \
            -H "${SERVER_HOST}" \
            >> "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Upload deploy package
        timeout-minutes: 30
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          echo "===== [upload 1/6] Prepare resumable upload ====="
          ARCHIVE=".deploy/${PACKAGE_NAME}"
          CHECKSUM_FILE="${ARCHIVE}.sha256"
          REMOTE_HOST="${SERVER_USER}@${SERVER_HOST}"
          REMOTE_DIR="${APP_DIR}/.deploy-incoming"
          REMOTE_ARCHIVE="${REMOTE_DIR}/${PACKAGE_NAME}"
          REMOTE_ARCHIVE_PART="${REMOTE_ARCHIVE}.part"
          REMOTE_CHECKSUM="${REMOTE_DIR}/${PACKAGE_NAME}.sha256"
          REMOTE_CHECKSUM_PART="${REMOTE_CHECKSUM}.part"
          UPLOAD_ATTEMPTS=3
          LOCAL_SHA256="$(awk 'NR == 1 { print $1; exit }' "${CHECKSUM_FILE}")"

          if ! command -v rsync >/dev/null 2>&1; then
            echo "Runner rsync: unavailable; upload step will use scp fallback."
            RUNNER_RSYNC_AVAILABLE=false
          else
            echo "Runner rsync: $(command -v rsync)"
            RUNNER_RSYNC_AVAILABLE=true
          fi
          command -v timeout >/dev/null 2>&1
          if [[ ! "${LOCAL_SHA256}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Local deploy package checksum is missing or malformed."
            exit 1
          fi

          ls -lh "${ARCHIVE}"
          du -h "${ARCHIVE}"
          echo "Archive size: ${PACKAGE_BYTES} bytes (${PACKAGE_MIB} MiB)"
          echo "Local SHA256: ${LOCAL_SHA256}"
          echo "Upload destination: ${REMOTE_HOST}:${REMOTE_DIR}/"

          SSH_OPTIONS=(
            -i "${RUNNER_TEMP}/easonfansclub_deploy_key" \
            -p "${SERVER_PORT}" \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            -o StrictHostKeyChecking=yes \
          )

          echo "===== [upload 2/6] Check SSH connectivity ====="
          timeout --foreground 60s ssh "${SSH_OPTIONS[@]}" "${REMOTE_HOST}" "echo SSH_OK"

          echo "===== [upload 3/6] Select upload transport ====="
          REMOTE_RSYNC_AVAILABLE="$(
            timeout --foreground 60s ssh "${SSH_OPTIONS[@]}" "${REMOTE_HOST}" \
              'if command -v rsync >/dev/null 2>&1; then printf yes; else printf no; fi'
          )"
          if [ "${RUNNER_RSYNC_AVAILABLE}" = true ] && [ "${REMOTE_RSYNC_AVAILABLE}" = yes ]; then
            USE_RSYNC=true
            TRANSPORT=rsync
            echo "Using rsync with partial resume and progress reporting."
          else
            USE_RSYNC=false
            TRANSPORT=scp
            echo "Using scp fallback with bounded retries."
          fi

          RSYNC_SSH_COMMAND="ssh -i ${RUNNER_TEMP}/easonfansclub_deploy_key -p ${SERVER_PORT} -o BatchMode=yes -o ConnectTimeout=30 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o StrictHostKeyChecking=yes"
          UPLOAD_START=$(date +%s)
          echo "Upload started at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          upload_once() {
            local archive_exit=1
            local checksum_exit=1

            if [ "${USE_RSYNC}" = true ]; then
              if rsync \
                --archive \
                --partial \
                --inplace \
                --append-verify \
                --human-readable \
                --info=progress2 \
                --timeout=120 \
                -e "${RSYNC_SSH_COMMAND}" \
                "${ARCHIVE}" \
                "${REMOTE_HOST}:${REMOTE_ARCHIVE_PART}"; then
                archive_exit=0
              else
                archive_exit=$?
              fi

              if [ "${archive_exit}" -eq 0 ]; then
                if rsync \
                  --archive \
                  --partial \
                  --inplace \
                  --append-verify \
                  --human-readable \
                  --info=progress2 \
                  --timeout=120 \
                  -e "${RSYNC_SSH_COMMAND}" \
                  "${CHECKSUM_FILE}" \
                  "${REMOTE_HOST}:${REMOTE_CHECKSUM_PART}"; then
                  checksum_exit=0
                else
                  checksum_exit=$?
                fi
              fi
            else
              if scp \
                -i "${RUNNER_TEMP}/easonfansclub_deploy_key" \
                -P "${SERVER_PORT}" \
                -o BatchMode=yes \
                -o ConnectTimeout=30 \
                -o ConnectionAttempts=3 \
                -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=20 \
                -o TCPKeepAlive=yes \
                -o StrictHostKeyChecking=yes \
                "${ARCHIVE}" \
                "${REMOTE_HOST}:${REMOTE_ARCHIVE_PART}"; then
                archive_exit=0
              else
                archive_exit=$?
              fi

              if [ "${archive_exit}" -eq 0 ]; then
                if scp \
                  -i "${RUNNER_TEMP}/easonfansclub_deploy_key" \
                  -P "${SERVER_PORT}" \
                  -o BatchMode=yes \
                  -o ConnectTimeout=30 \
                  -o ConnectionAttempts=3 \
                  -o ServerAliveInterval=15 \
                  -o ServerAliveCountMax=20 \
                  -o TCPKeepAlive=yes \
                  -o StrictHostKeyChecking=yes \
                  "${CHECKSUM_FILE}" \
                  "${REMOTE_HOST}:${REMOTE_CHECKSUM_PART}"; then
                  checksum_exit=0
                else
                  checksum_exit=$?
                fi
              fi
            fi

            if [ "${archive_exit}" -eq 0 ] && [ "${checksum_exit}" -eq 0 ]; then
              return 0
            fi

            echo "Upload attempt failed (archive=${archive_exit}, checksum=${checksum_exit})."
            return 1
          }

          upload_succeeded=false
          ATTEMPTS_USED=0
          for attempt in $(seq 1 "${UPLOAD_ATTEMPTS}"); do
            ATTEMPTS_USED="${attempt}"
            attempt_start=$(date +%s)
            attempt_started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "===== Upload attempt ${attempt}/${UPLOAD_ATTEMPTS} ====="
            echo "Transport: ${TRANSPORT}"
            echo "Started: ${attempt_started_at}"
            if upload_once; then
              upload_succeeded=true
              break
            fi

            echo "Upload attempt ${attempt}/${UPLOAD_ATTEMPTS} failed"
            echo "Elapsed: $(( $(date +%s) - attempt_start )) seconds"
            if [ "${attempt}" -lt "${UPLOAD_ATTEMPTS}" ]; then
              backoff_seconds=$((10 * attempt))
              echo "Retrying in ${backoff_seconds} seconds; resumable partial files are preserved."
              sleep "${backoff_seconds}"
            fi
          done

          UPLOAD_END=$(date +%s)
          if [ "${upload_succeeded}" != true ]; then
            echo "::error::Upload failed after ${UPLOAD_ATTEMPTS} attempts."
            echo "Upload failed at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Upload elapsed: $((UPLOAD_END - UPLOAD_START)) seconds"
            exit 1
          fi

          echo "===== [upload 4/6] Verify remote SHA256 ====="
          REMOTE_SHA256="$(
            timeout --foreground 60s ssh "${SSH_OPTIONS[@]}" "${REMOTE_HOST}" \
              "test -s '${REMOTE_ARCHIVE_PART}' && sha256sum -- '${REMOTE_ARCHIVE_PART}' | awk '{print \$1}'"
          )"
          echo "Remote partial SHA256: ${REMOTE_SHA256}"
          if [ "${LOCAL_SHA256}" != "${REMOTE_SHA256}" ]; then
            echo "::error::SHA256 mismatch: local=${LOCAL_SHA256}, remote=${REMOTE_SHA256}"
            echo "Upload failed after $((UPLOAD_END - UPLOAD_START)) seconds."
            exit 1
          fi

          echo "===== [upload 5/6] Promote verified package ====="
          timeout --foreground 60s ssh "${SSH_OPTIONS[@]}" "${REMOTE_HOST}" \
            "set -e; mv -f -- '${REMOTE_CHECKSUM_PART}' '${REMOTE_CHECKSUM}'; mv -f -- '${REMOTE_ARCHIVE_PART}' '${REMOTE_ARCHIVE}'"

          echo "===== [upload 6/6] Confirm promoted package ====="
          REMOTE_FINAL_SHA256="$(
            timeout --foreground 60s ssh "${SSH_OPTIONS[@]}" "${REMOTE_HOST}" \
              "sha256sum -- '${REMOTE_ARCHIVE}' | awk '{print \$1}'"
          )"
          if [ "${LOCAL_SHA256}" != "${REMOTE_FINAL_SHA256}" ]; then
            echo "::error::Promoted package SHA256 mismatch: local=${LOCAL_SHA256}, remote=${REMOTE_FINAL_SHA256}"
            echo "Upload failed after $(( $(date +%s) - UPLOAD_START )) seconds."
            exit 1
          fi

          echo "Remote final SHA256: ${REMOTE_FINAL_SHA256}"
          echo "Upload completed"
          echo "Transport: ${TRANSPORT}"
          echo "Attempts used: ${ATTEMPTS_USED}"
          echo "Elapsed: $(( $(date +%s) - UPLOAD_START )) seconds"
          echo "Local SHA256: ${LOCAL_SHA256}"
          echo "Remote SHA256: ${REMOTE_FINAL_SHA256}"
          echo "SHA256_OK"
          echo "Upload finished at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Build release, migrate, switch, and reload
        uses: appleboy/ssh-action@v1
        env:
          APP_DIR: ${{ env.APP_DIR }}
          APP_PORT: ${{ env.APP_PORT }}
          PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
          DEPLOY_SHA: ${{ github.sha }}
          PM2_APP_NAME: easonfansclub
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: APP_DIR,APP_PORT,PACKAGE_NAME,DEPLOY_SHA,PM2_APP_NAME
          command_timeout: 35m
          script: |
            set -Eeuo pipefail

            log_step() {
              printf '\n===== [deploy %s] %s =====\n' "$1" "$2"
            }

            log_step "1/8" "Load production runtime"
            export NVM_DIR="${HOME}/.nvm"
            if [ -s "${NVM_DIR}/nvm.sh" ]; then
              . "${NVM_DIR}/nvm.sh"
            fi

            command -v node
            command -v pnpm
            command -v pm2

            if [[ ! "${DEPLOY_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'DEPLOY_SHA is not a 40-character hexadecimal Git SHA.' >&2
              exit 1
            fi
            if [[ ! "${PACKAGE_NAME}" =~ ^easonfansclub-[0-9a-f]{40}\.tar\.gz$ ]]; then
              echo 'PACKAGE_NAME has an unexpected format.' >&2
              exit 1
            fi

            releases_dir="${APP_DIR}/releases"
            shared_dir="${APP_DIR}/shared"
            current_link="${APP_DIR}/current"
            incoming_dir="${APP_DIR}/.deploy-incoming"
            release_id="$(date -u +%Y%m%d%H%M%S)-${DEPLOY_SHA:0:12}"
            release_dir="${releases_dir}/${release_id}"
            previous_target="$(readlink -f -- "${current_link}")"
            archive_path="${incoming_dir}/${PACKAGE_NAME}"
            checksum_path="${archive_path}.sha256"
            deployment_succeeded=false

            on_exit() {
              local status=$?
              if [ "${deployment_succeeded}" != true ] && [ -d "${release_dir}" ]; then
                printf '%s\n' "${DEPLOY_SHA}" > "${release_dir}/.deploy-failed" || true
              fi
              return "${status}"
            }
            trap on_exit EXIT

            case "${previous_target}" in
              "${releases_dir}/"*) ;;
              *)
                echo "Current target is outside the release root: ${previous_target}" >&2
                exit 1
                ;;
            esac
            test -r "${shared_dir}/.env"
            test -s "${shared_dir}/.env"
            test -s "${previous_target}/.deployed-sha"
            test -w "${releases_dir}"

            log_step "2/8" "Verify stable deployment layout"
            test -L "${current_link}"

            log_step "3/8" "Verify and extract package into a new release"
            cd "${incoming_dir}"
            echo "Remote package size: $(stat -c '%s bytes' "${PACKAGE_NAME}")"
            sha256sum -c "${PACKAGE_NAME}.sha256"
            archive_listing="${incoming_dir}/${PACKAGE_NAME}.contents"
            tar -tzf "${archive_path}" > "${archive_listing}"
            if grep -Eq '(^/|(^|/)\.\.(/|$))' "${archive_listing}"; then
              echo 'Deploy archive contains an absolute or parent-traversal path.' >&2
              exit 1
            fi
            if grep -Eq '(^|/)(node_modules|\.git|tests|\.env($|\.)|\.log$)' "${archive_listing}"; then
              echo 'Deploy archive contains a forbidden development, secret, or temporary file.' >&2
              exit 1
            fi
            install -d -m 755 "${release_dir}"
            tar -xzf "${archive_path}" -C "${release_dir}" --no-same-owner
            ln -s "${shared_dir}/.env" "${release_dir}/.env"
            printf '%s\n' "${DEPLOY_SHA}" > "${release_dir}/.deployed-sha"

            test -f "${release_dir}/package.json"
            test -f "${release_dir}/pnpm-lock.yaml"
            test -f "${release_dir}/server.ts"
            test -f "${release_dir}/ecosystem.config.js"
            test -L "${release_dir}/.env"

            node -v
            pnpm -v
            pm2 -v

            log_step "4/8" "Install dependencies and generate Prisma client in release"
            cd "${release_dir}"
            install_started="$(date +%s)"
            pnpm install --frozen-lockfile
            test -d node_modules
            echo "Dependency install completed in $(( $(date +%s) - install_started ))s."
            pnpm prisma generate

            log_step "5/8" "Build release before touching current"
            build_started="$(date +%s)"
            build_node_options="--max-old-space-size=4096"
            echo "Node build options: ${build_node_options}"
            echo "Memory before build:"
            free -h || true
            echo "Swap before build:"
            swapon --show || true
            echo "Top memory-consuming processes before build:"
            ps -eo pid,ppid,%mem,%cpu,rss,cmd --sort=-rss | head -15 || true
            echo "Existing next build processes before build:"
            pgrep -af "next build" || true
            NODE_OPTIONS="${build_node_options}" pnpm build
            test -s "${release_dir}/.next/BUILD_ID"
            test -d "${release_dir}/.next/static"
            test -d "${release_dir}/public"
            echo "Memory after build:"
            free -h || true
            echo "Build completed successfully in $(( $(date +%s) - build_started ))s."

            log_step "6/8" "Apply backward-compatible migrations after build"
            pnpm migration:check:mysql
            NODE_ENV=production pnpm prisma migrate deploy

            atomic_switch() {
              local target="$1"
              local temporary_link="${APP_DIR}/.current-${release_id}-${RANDOM}"
              case "${target}" in
                "${releases_dir}/"*) ;;
                *) echo "Refusing to point current outside releases/: ${target}" >&2; return 1 ;;
              esac
              if [ -e "${temporary_link}" ] || [ -L "${temporary_link}" ]; then
                rm -f -- "${temporary_link}"
              fi
              ln -s -- "${target}" "${temporary_link}"
              mv -Tf -- "${temporary_link}" "${current_link}"
            }

            read_pm2_snapshot() {
              local pm2_json pm2_snapshot
              if ! pm2_json="$(pm2 jlist)"; then
                echo "Unable to read PM2 process list." >&2
                return 1
              fi
              if ! pm2_snapshot="$(printf '%s' "${pm2_json}" | node -e '
                let raw = "";
                process.stdin.on("data", (chunk) => { raw += chunk; });
                process.stdin.on("end", () => {
                  try {
                    const appName = process.argv[1];
                    const app = JSON.parse(raw).find((entry) => entry.name === appName);
                    if (!app) process.exit(1);
                    const env = app.pm2_env || {};
                    process.stdout.write(JSON.stringify({
                      cwd: env.pm_cwd || "",
                      script: env.pm_exec_path || "",
                      args: Array.isArray(env.args) ? env.args.join(" ") : String(env.args || ""),
                      interpreter: env.exec_interpreter || "",
                      execMode: env.exec_mode || "",
                      instances: Number(env.instances || 1),
                    }));
                  } catch {
                    process.exit(2);
                  }
                });
              ' "${PM2_APP_NAME}")"; then
                echo "PM2 app ${PM2_APP_NAME} is not present in the process list." >&2
                return 1
              fi
              pm2_cwd="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).cwd)' "${pm2_snapshot}")"
              pm2_script="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).script)' "${pm2_snapshot}")"
              pm2_args="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).args)' "${pm2_snapshot}")"
              pm2_interpreter="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).interpreter)' "${pm2_snapshot}")"
              pm2_exec_mode="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).execMode)' "${pm2_snapshot}")"
              pm2_instances="$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).instances))' "${pm2_snapshot}")"
            }

            pm2_app_exists() {
              local pm2_json pm2_status
              if ! pm2_json="$(pm2 jlist)"; then
                echo "Unable to read PM2 process list." >&2
                return 2
              fi
              if printf '%s' "${pm2_json}" | node -e '
                let raw = "";
                process.stdin.on("data", (chunk) => { raw += chunk; });
                process.stdin.on("end", () => {
                  try {
                    const appName = process.argv[1];
                    const exists = JSON.parse(raw).some((entry) => entry.name === appName);
                    process.exit(exists ? 0 : 1);
                  } catch {
                    process.exit(2);
                  }
                });
              ' "${PM2_APP_NAME}"; then
                return 0
              else
                pm2_status=$?
                if [ "${pm2_status}" -eq 1 ]; then
                  return 1
                fi
                echo "PM2 process list is invalid; refusing to create a duplicate process." >&2
                return 2
              fi
            }

            pm2_script_is_npm() {
              case "$1" in
                npm|*/npm|npm.cmd|*/npm.cmd) return 0 ;;
                *) return 1 ;;
              esac
            }

            pm2_is_current_release() {
              [ "${pm2_cwd}" = "${current_link}" ] || return 1
              pm2_script_is_npm "${pm2_script}" || return 1
              [ "${pm2_args}" = "run start" ]
            }

            reload_pm2() {
              local release_sha="$1"
              local current_realpath expected_current
              export NODE_ENV=production
              export DEPLOY_SHA="${release_sha}"
              export PORT="${APP_PORT}"
              pm2_cwd=""
              pm2_script=""
              pm2_args=""
              pm2_interpreter=""
              pm2_exec_mode=""
              pm2_instances=""
              cd "${current_link}"
              echo "PM2 launch cwd:"
              pwd
              echo "PM2 launch release:"
              current_realpath="$(readlink -f -- .)"
              echo "${current_realpath}"
              expected_current="$(readlink -f -- "${current_link}")"
              if [ -z "${current_realpath}" ] || [ "${current_realpath}" != "${expected_current}" ]; then
                echo "PM2 launch directory does not resolve through current: ${current_realpath}" >&2
                return 1
              fi
              case "${current_realpath}" in
                "${releases_dir}/"*) ;;
                *)
                  echo "PM2 launch directory is outside releases/: ${current_realpath}" >&2
                  return 1
                  ;;
              esac
              test -f ecosystem.config.js
              echo "Recreating PM2 ${PM2_APP_NAME} from ecosystem.config.js after current switch."
              pm2 delete "${PM2_APP_NAME}" || true
              pm2 start ecosystem.config.js --update-env
              pm2 save || true
              sleep 10
              echo "PM2 description after ecosystem operation:"
              pm2 describe "${PM2_APP_NAME}" || true
              if read_pm2_snapshot && pm2_is_current_release; then
                echo "PM2 configuration currently matches current release."
              else
                echo "PM2 configuration is not yet confirmed; runtime health validation will retry after startup settling." >&2
              fi
              echo "PM2 exec_mode=${pm2_exec_mode:-} instances=${pm2_instances:-} cwd=${pm2_cwd:-} script=${pm2_script:-} args=${pm2_args:-} interpreter=${pm2_interpreter:-}"
              return 0
            }

            print_health_diagnostics() {
              echo "===== Health check diagnostics =====" >&2
              echo "pwd:" >&2
              pwd >&2 || true
              echo "current release target:" >&2
              readlink -f -- "${current_link}" >&2 || true
              echo "deployed SHA:" >&2
              cat "${current_link}/.deployed-sha" >&2 || true
              echo "PM2 description:" >&2
              pm2 describe "${PM2_APP_NAME}" >&2 || true
              echo "Listening port:" >&2
              ss -lntp | grep "${APP_PORT}" >&2 || true
              echo "Local HTTP headers:" >&2
              curl -I --max-time 10 "http://127.0.0.1:${APP_PORT}" >&2 || true
              echo "PM2 error log (last 200 lines):" >&2
              tail -200 -- "${HOME}/.pm2/logs/${PM2_APP_NAME}-error.log" >&2 || true
            }

            check_health() {
              local health_response active_target deployed_sha pm2_ready
              for attempt in $(seq 1 10); do
                health_response="$(curl --fail --silent --show-error --max-time 10 "http://127.0.0.1:${APP_PORT}/api/health/live" || true)"
                active_target="$(readlink -f -- "${current_link}" || true)"
                deployed_sha="$(cat "${current_link}/.deployed-sha" 2>/dev/null || true)"
                pm2_ready=false
                if read_pm2_snapshot 2>/dev/null && pm2_is_current_release; then
                  pm2_ready=true
                fi
                if [ "${active_target}" = "${release_dir}" ] &&
                   [ "${deployed_sha}" = "${DEPLOY_SHA}" ] &&
                   printf '%s' "${health_response}" | grep -Fq "\"release\":\"${DEPLOY_SHA}\"" &&
                   [ "${pm2_ready}" = true ]; then
                  return 0
                fi
                echo "Health attempt ${attempt}/10 did not confirm release ${DEPLOY_SHA} (pm2_ready=${pm2_ready})."
                sleep 3
              done
              return 1
            }

            rollback_release() {
              local previous_sha
              print_health_diagnostics
              previous_sha="$(cat "${previous_target}/.deployed-sha")"
              printf '%s\n' "${DEPLOY_SHA}" > "${release_dir}/.deploy-failed" || true
              echo "Health check failed; atomically restoring ${previous_target}." >&2
              atomic_switch "${previous_target}"
              if ! reload_pm2 "${previous_sha}"; then
                echo "Rollback PM2 restart from ecosystem.config.js failed." >&2
              fi
              pm2 logs "${PM2_APP_NAME}" --lines 80 --nostream || true
            }

            log_step "7/8" "Atomically switch current and restart PM2"
            atomic_switch "${release_dir}"
            reload_pm2 "${DEPLOY_SHA}" || echo "PM2 operation returned non-zero; continuing to settle and validate through health check." >&2
            cd "${current_link}"
            print_health_diagnostics
            if ! check_health; then
              rollback_release
              exit 1
            fi

            log_step "8/8" "Verify release and retain rollback metadata"
            if ! ss -ltn | grep -Eq "[[:space:]](127\\.0\\.0\\.1|\\[::1\\]):${APP_PORT}[[:space:]]"; then
              echo 'Application port must be bound to localhost behind Nginx.' >&2
              rollback_release
              exit 1
            fi
            previous_metadata="${shared_dir}/previous-release"
            previous_metadata_tmp="${shared_dir}/.previous-release-${release_id}.tmp"
            printf '%s\n' "${previous_target}" > "${previous_metadata_tmp}"
            mv -Tf -- "${previous_metadata_tmp}" "${previous_metadata}"
            pm2 describe "${PM2_APP_NAME}" || true
            echo "Current release: $(readlink -f -- "${current_link}")"
            echo "Previous release: ${previous_target}"

            kept=0
            while IFS= read -r release_entry; do
              release_path="${release_entry#* }"
              [ -n "${release_path}" ] || continue
              case "${release_path}" in
                "${releases_dir}/"*) ;;
                *) continue ;;
              esac
              if [ "${release_path}" = "${release_dir}" ] ||
                 [ "${release_path}" = "${previous_target}" ] ||
                 [ -f "${release_path}/.deploy-failed" ]; then
                continue
              fi
              kept=$((kept + 1))
              if [ "${kept}" -gt 4 ]; then
                echo "Removing old successful release: ${release_path}"
                rm -rf -- "${release_path}"
              fi
            done < <(find "${releases_dir}" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr)

            rm -f -- "${archive_path}" "${checksum_path}" "${archive_listing}"
            deployment_succeeded=true
            echo "Deployment health check passed for ${DEPLOY_SHA}."

      - name: Verify public website
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail

          for public_url in \
            "https://${SERVER_HOST}/login" \
            "http://${SERVER_HOST}/login"; do
            if curl --insecure \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 3 \
              --connect-timeout 10 \
              --max-time 20 \
              "${public_url}" > /dev/null; then
              echo "Public website health check passed: ${public_url}"
              exit 0
            fi
          done

          echo "::error::The public website did not respond successfully over HTTPS or HTTP."
          exit 1
