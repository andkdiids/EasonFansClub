name: Deploy to Tencent Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true


jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      - name: Prepare deploy package
        run: |
          tar \
            --warning=no-file-changed \
            --ignore-failed-read \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=.git \
            --exclude=.github \
            --exclude=deploy.tar.gz \
            --exclude=*.log \
            --exclude=*.tmp \
            --exclude=.env* \
            --exclude=public/uploads \
            -czf deploy.tar.gz .


      - name: Upload project
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/home/ubuntu/EasonFansClub"


      - name: Build and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 60m
          script_stop: true

          script: |
            set -euo pipefail

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            export PATH="/home/ubuntu/.nvm/versions/node/v22.23.1/bin:$PATH"

            cd /home/ubuntu/EasonFansClub

            find . -maxdepth 1 -type f ! -name ".env" -delete

            tar -xzf deploy.tar.gz
            rm deploy.tar.gz

            node -v
            pnpm -v
            pm2 -v

            pnpm install --frozen-lockfile

            pnpm prisma generate

            pnpm prisma migrate deploy

            pnpm build

            pm2 restart easonfansclub --update-env
