name: Configure Android version metadata

on:
  workflow_dispatch:
    inputs:
      expected_production_sha:
        description: Exact currently deployed production SHA (required; prevents stale config writes)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    name: Configure Beta.21 RC2 Android metadata without database access
    runs-on: ubuntu-22.04
    environment: Production
    timeout-minutes: 45
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify final APK stored in COS
        env:
          APK_URL: https://media.ecfc.fans/media/android/releases/ECFC-1.0.0-beta.21-release-beta21-rc2-20261030-172352.apk
          EXPECTED_SIZE: "180836567"
          EXPECTED_SHA256: 463E70B7A3652498EE6286D56F9B306A3222D30905C73C22B59EA61F3113282B
        run: |
          set -euo pipefail
          apk_path="${RUNNER_TEMP}/ecfc-beta21-rc2.apk"
          headers_path="${RUNNER_TEMP}/ecfc-beta21-rc2-cos-headers.txt"
          curl --fail --silent --show-error --location --max-time 2400 \
            --dump-header "${headers_path}" --output "${apk_path}" "${APK_URL}"
          actual_size="$(stat -c '%s' "${apk_path}")"
          actual_sha256="$(sha256sum "${apk_path}" | awk '{print toupper($1)}')"
          [[ "${actual_size}" == "${EXPECTED_SIZE}" ]] || { echo 'COS_APK_SIZE_MISMATCH'; exit 1; }
          [[ "${actual_sha256}" == "${EXPECTED_SHA256}" ]] || { echo 'COS_APK_SHA256_MISMATCH'; exit 1; }
          range_status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' \
            --range 0-0 --max-time 30 "${APK_URL}")"
          [[ "${range_status}" == 206 ]] || { echo 'COS_RANGE_REQUEST_NOT_206'; exit 1; }
          echo "COS_APK_SIZE=${actual_size}"
          echo "COS_APK_SHA256=${actual_sha256}"
          echo 'COS_RANGE_206=YES'

      - name: Validate pinned production SSH settings
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          PINNED_HOST_KEY_SHA256: ${{ vars.PRODUCTION_SSH_HOST_KEY_SHA256 }}
          EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
        run: |
          set -euo pipefail
          for name in SERVER_HOST SERVER_USER SERVER_PORT SERVER_SSH_KEY PINNED_HOST_KEY_SHA256 EXPECTED_PRODUCTION_SHA; do
            [[ -n "${!name:-}" ]] || { echo "::error::Required protected setting ${name} is missing."; exit 1; }
          done
          [[ "${SERVER_HOST}" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "${SERVER_USER}" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "${SERVER_PORT}" =~ ^[0-9]{1,5}$ ]]
          (( 10#${SERVER_PORT} >= 1 && 10#${SERVER_PORT} <= 65535 ))
          [[ "${PINNED_HOST_KEY_SHA256}" =~ ^SHA256:[A-Za-z0-9+/]+=?$ ]]
          [[ "${EXPECTED_PRODUCTION_SHA}" =~ ^[0-9a-f]{40}$ ]]
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SERVER_SSH_KEY}" | tr -d '\r' > "${RUNNER_TEMP}/easonfansclub_deploy_key"
          chmod 600 "${RUNNER_TEMP}/easonfansclub_deploy_key"
          scan_file="${RUNNER_TEMP}/host-scan"
          verified_file="${RUNNER_TEMP}/known-hosts"
          key_line_file="${RUNNER_TEMP}/key-line"
          timeout 30s ssh-keyscan -T 15 -p "${SERVER_PORT}" -H "${SERVER_HOST}" > "${scan_file}" 2>/dev/null
          : > "${verified_file}"
          while IFS= read -r entry; do
            [[ -n "${entry}" && "${entry}" != \#* ]] || continue
            printf '%s\n' "${entry}" > "${key_line_file}"
            fingerprint="$(ssh-keygen -lf "${key_line_file}" -E sha256 | awk 'NR == 1 {print $2}')"
            if [[ "${fingerprint}" == "${PINNED_HOST_KEY_SHA256}" ]]; then printf '%s\n' "${entry}" >> "${verified_file}"; fi
          done < "${scan_file}"
          [[ -s "${verified_file}" ]] || { echo '::error::Production SSH host key fingerprint mismatch.'; exit 1; }
          ssh-keygen -lf "${verified_file}" -E sha256 | awk '{print $2}' | grep -Fx -- "${PINNED_HOST_KEY_SHA256}" >/dev/null
          install -m 600 "${verified_file}" "${HOME}/.ssh/known_hosts"
          echo 'PRODUCTION_SSH_HOST_PIN=VERIFIED'

      - name: Update only Android version variables in production shared env
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
        run: |
          set -euo pipefail
          apk_sha='463E70B7A3652498EE6286D56F9B306A3222D30905C73C22B59EA61F3113282B'
          notes='["分享升级为图片卡片并加入二维码","帖子、勋章、个人主页、活动、话题活动与 Salon 支持图片分享","每日处方支持全屏查看、缩放、保存和分享","处方架分享入口调整至右上角","更新下载支持后台下载与进度恢复","Beta.21 RC2 内测版本"]'
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          config="$(jq -cn --arg name '1.0.0-beta.21' --argjson code 22 --argjson minimum 19 \
            --argjson force false --arg key 'android/releases/ECFC-1.0.0-beta.21-release-beta21-rc2-20261030-172352.apk' \
            --arg sha "${apk_sha}" --argjson size 180836567 --arg notes "${notes}" --arg published "${published_at}" \
            '{ANDROID_VERSION_NAME:$name,ANDROID_VERSION_CODE:$code,ANDROID_MINIMUM_VERSION_CODE:$minimum,ANDROID_FORCE_UPDATE:$force,ANDROID_APK_COS_KEY:$key,ANDROID_APK_SHA256:$sha,ANDROID_APK_SIZE:$size,ANDROID_RELEASE_NOTES:$notes,ANDROID_PUBLISHED_AT:$published}')"
          config_b64="$(printf '%s' "${config}" | base64 -w0)"
          [[ "${config_b64}" =~ ^[A-Za-z0-9+/]+=*$ ]] || { echo 'ANDROID_CONFIG_ENCODING_INVALID'; exit 1; }
          remote_host="${SERVER_USER}@${SERVER_HOST}"
          printf -v remote_command 'flock -n %q env APP_DIR=%q EXPECTED_PRODUCTION_SHA=%q ANDROID_RELEASE_METADATA_B64=%q node --input-type=module -' \
            '/home/apps/easonfansclub/.deploy.lock' '/home/apps/easonfansclub' "${EXPECTED_PRODUCTION_SHA}" "${config_b64}"
          ssh_options=(
            -T -p "${SERVER_PORT}" -i "${RUNNER_TEMP}/easonfansclub_deploy_key"
            -o BatchMode=yes -o IdentitiesOnly=yes -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=10
          )
          timeout --foreground --signal=TERM --kill-after=10s 90s \
            ssh "${ssh_options[@]}" "${remote_host}" "${remote_command}" \
            < scripts/update-android-version-env.mjs
