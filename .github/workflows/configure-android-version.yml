name: Configure Android version metadata

on:
  workflow_dispatch:
    inputs:
      expected_production_sha:
        description: Exact currently deployed production SHA (required; prevents stale config writes)
        required: true
        type: string
      release_candidate:
        description: Beta.21 RC3, RC4, or RC5 to publish for internal updates
        required: true
        type: choice
        options:
          - rc3
          - rc4
          - rc5
      apk_object_key:
        description: Immutable versioned Beta.21 RC object key already uploaded to Tencent COS
        required: true
        type: string
      apk_sha256:
        description: Uppercase SHA-256 of the signed Beta.21 RC APK
        required: true
        type: string
      apk_size:
        description: Exact APK size in bytes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    name: Configure Beta.21 Android metadata without database access
    runs-on: ubuntu-22.04
    environment: Production
    timeout-minutes: 45
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify final APK stored in COS
        env:
          APK_OBJECT_KEY: ${{ inputs.apk_object_key }}
          EXPECTED_SIZE: ${{ inputs.apk_size }}
          EXPECTED_SHA256: ${{ inputs.apk_sha256 }}
          RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_CANDIDATE}" == rc3 || "${RELEASE_CANDIDATE}" == rc4 || "${RELEASE_CANDIDATE}" == rc5 ]] || { echo 'RELEASE_CANDIDATE_INVALID'; exit 1; }
          key_regex="^android/releases/ECFC-1\\.0\\.0-beta\\.21-release-beta21-${RELEASE_CANDIDATE}-[0-9]{8}-[0-9]{6}\\.apk$"
          [[ "${APK_OBJECT_KEY}" =~ ${key_regex} ]] || { echo 'APK_OBJECT_KEY_INVALID'; exit 1; }
          [[ "${EXPECTED_SIZE}" =~ ^[0-9]{8,9}$ ]] || { echo 'APK_SIZE_INVALID'; exit 1; }
          (( 10#${EXPECTED_SIZE} >= 10000000 && 10#${EXPECTED_SIZE} <= 500000000 )) || { echo 'APK_SIZE_OUT_OF_RANGE'; exit 1; }
          [[ "${EXPECTED_SHA256}" =~ ^[A-F0-9]{64}$ ]] || { echo 'APK_SHA256_INVALID'; exit 1; }
          apk_url="https://media.ecfc.fans/media/${APK_OBJECT_KEY}"
          apk_path="${RUNNER_TEMP}/ecfc-beta21-${RELEASE_CANDIDATE}.apk"
          headers_path="${RUNNER_TEMP}/ecfc-beta21-${RELEASE_CANDIDATE}-cos-headers.txt"
          curl --fail --silent --show-error --location --max-time 2400 \
            --dump-header "${headers_path}" --output "${apk_path}" "${apk_url}"
          actual_size="$(stat -c '%s' "${apk_path}")"
          actual_sha256="$(sha256sum "${apk_path}" | awk '{print toupper($1)}')"
          [[ "${actual_size}" == "${EXPECTED_SIZE}" ]] || { echo 'COS_APK_SIZE_MISMATCH'; exit 1; }
          [[ "${actual_sha256}" == "${EXPECTED_SHA256}" ]] || { echo 'COS_APK_SHA256_MISMATCH'; exit 1; }
          range_status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' \
            --range 0-0 --max-time 30 "${apk_url}")"
          [[ "${range_status}" == 206 ]] || { echo 'COS_RANGE_REQUEST_NOT_206'; exit 1; }
          echo "COS_APK_SIZE=${actual_size}"
          echo "COS_APK_SHA256=${actual_sha256}"
          echo 'COS_RANGE_206=YES'

      - name: Validate pinned production SSH settings
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          PINNED_HOST_KEY_SHA256: ${{ vars.PRODUCTION_SSH_HOST_KEY_SHA256 }}
          EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
        run: |
          set -euo pipefail
          for name in SERVER_HOST SERVER_USER SERVER_PORT SERVER_SSH_KEY PINNED_HOST_KEY_SHA256 EXPECTED_PRODUCTION_SHA; do
            [[ -n "${!name:-}" ]] || { echo "::error::Required protected setting ${name} is missing."; exit 1; }
          done
          [[ "${SERVER_HOST}" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "${SERVER_USER}" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "${SERVER_PORT}" =~ ^[0-9]{1,5}$ ]]
          (( 10#${SERVER_PORT} >= 1 && 10#${SERVER_PORT} <= 65535 ))
          [[ "${PINNED_HOST_KEY_SHA256}" =~ ^SHA256:[A-Za-z0-9+/]+=?$ ]]
          [[ "${EXPECTED_PRODUCTION_SHA}" =~ ^[0-9a-f]{40}$ ]]
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SERVER_SSH_KEY}" | tr -d '\r' > "${RUNNER_TEMP}/easonfansclub_deploy_key"
          chmod 600 "${RUNNER_TEMP}/easonfansclub_deploy_key"
          scan_file="${RUNNER_TEMP}/host-scan"
          verified_file="${RUNNER_TEMP}/known-hosts"
          key_line_file="${RUNNER_TEMP}/key-line"
          timeout 30s ssh-keyscan -T 15 -p "${SERVER_PORT}" -H "${SERVER_HOST}" > "${scan_file}" 2>/dev/null
          : > "${verified_file}"
          while IFS= read -r entry; do
            [[ -n "${entry}" && "${entry}" != \#* ]] || continue
            printf '%s\n' "${entry}" > "${key_line_file}"
            fingerprint="$(ssh-keygen -lf "${key_line_file}" -E sha256 | awk 'NR == 1 {print $2}')"
            if [[ "${fingerprint}" == "${PINNED_HOST_KEY_SHA256}" ]]; then printf '%s\n' "${entry}" >> "${verified_file}"; fi
          done < "${scan_file}"
          [[ -s "${verified_file}" ]] || { echo '::error::Production SSH host key fingerprint mismatch.'; exit 1; }
          ssh-keygen -lf "${verified_file}" -E sha256 | awk '{print $2}' | grep -Fx -- "${PINNED_HOST_KEY_SHA256}" >/dev/null
          install -m 600 "${verified_file}" "${HOME}/.ssh/known_hosts"
          echo 'PRODUCTION_SSH_HOST_PIN=VERIFIED'

      - name: Update only Android version variables in production shared env
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
          APK_OBJECT_KEY: ${{ inputs.apk_object_key }}
          EXPECTED_SHA256: ${{ inputs.apk_sha256 }}
          EXPECTED_SIZE: ${{ inputs.apk_size }}
          RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
        run: |
          set -euo pipefail
          case "${RELEASE_CANDIDATE}" in
            rc3)
              version_code=23
              notes='["分享卡展示帖子原图、作者头像和正式品牌资源","图片分享同时提供说明文字与规范公开链接","二维码和分享文案使用同一公开网址","每日处方分享与更新下载体验改进","RC3 内测修复","Beta.21 RC3 内测版本"]'
              ;;
            rc4)
              version_code=24
              notes='["分享入口提供私信、图片和链接三种独立方式","好友分享复用站内通讯录和私信","图片分享仅在选择后生成带二维码卡片","链接分享直接提供规范 HTTPS 网页地址","每日处方分享导出改为按需生成","Beta.21 RC4 内测版本"]'
              ;;
            rc5)
              version_code=25
              notes='["修复活跃症任务导航空路由","新增反馈与更新并接入现有反馈 API","App 启动时静默检查更新并复用现有更新器","个人主页扫码入口新增我的二维码和扫一扫","产品名称更新为番茄酱牛腩面不吃辣","Beta.21 RC5 内测版本"]'
              ;;
            *) echo 'RELEASE_CANDIDATE_INVALID'; exit 1 ;;
          esac
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          config="$(jq -cn --arg name '1.0.0-beta.21' --argjson code "${version_code}" --argjson minimum 19 \
            --argjson force false --arg key "${APK_OBJECT_KEY}" \
            --arg sha "${EXPECTED_SHA256}" --argjson size "${EXPECTED_SIZE}" --arg notes "${notes}" --arg published "${published_at}" \
            '{ANDROID_VERSION_NAME:$name,ANDROID_VERSION_CODE:$code,ANDROID_MINIMUM_VERSION_CODE:$minimum,ANDROID_FORCE_UPDATE:$force,ANDROID_APK_COS_KEY:$key,ANDROID_APK_SHA256:$sha,ANDROID_APK_SIZE:$size,ANDROID_RELEASE_NOTES:$notes,ANDROID_PUBLISHED_AT:$published}')"
          config_b64="$(printf '%s' "${config}" | base64 -w0)"
          [[ "${config_b64}" =~ ^[A-Za-z0-9+/]+=*$ ]] || { echo 'ANDROID_CONFIG_ENCODING_INVALID'; exit 1; }
          remote_host="${SERVER_USER}@${SERVER_HOST}"
          printf -v remote_command 'flock -n %q env APP_DIR=%q EXPECTED_PRODUCTION_SHA=%q ANDROID_RELEASE_METADATA_B64=%q node --input-type=module -' \
            '/home/apps/easonfansclub/.deploy.lock' '/home/apps/easonfansclub' "${EXPECTED_PRODUCTION_SHA}" "${config_b64}"
          ssh_options=(
            -T -p "${SERVER_PORT}" -i "${RUNNER_TEMP}/easonfansclub_deploy_key"
            -o BatchMode=yes -o IdentitiesOnly=yes -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=10
          )
          timeout --foreground --signal=TERM --kill-after=10s 90s \
            ssh "${ssh_options[@]}" "${remote_host}" "${remote_command}" \
            < scripts/update-android-version-env.mjs

      - name: Reload only the web process and verify the active metadata
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          PINNED_HOST_KEY_SHA256: ${{ vars.PRODUCTION_SSH_HOST_KEY_SHA256 }}
          EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
          APK_SHA256: ${{ inputs.apk_sha256 }}
          APK_SIZE: ${{ inputs.apk_size }}
          RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
        run: |
          set -euo pipefail
          for name in SERVER_HOST SERVER_USER SERVER_PORT SERVER_SSH_KEY PINNED_HOST_KEY_SHA256 EXPECTED_PRODUCTION_SHA APK_SHA256 APK_SIZE RELEASE_CANDIDATE; do
            [[ -n "${!name:-}" ]] || { echo "::error::Required protected setting ${name} is missing."; exit 1; }
          done
          [[ "${EXPECTED_PRODUCTION_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${APK_SHA256}" =~ ^[A-F0-9]{64}$ ]]
          [[ "${APK_SIZE}" =~ ^[0-9]{8,9}$ ]]
          case "${RELEASE_CANDIDATE}" in
            rc3) expected_version_code=23 ;;
            rc4) expected_version_code=24 ;;
            rc5) expected_version_code=25 ;;
            *) echo 'RELEASE_CANDIDATE_INVALID'; exit 1 ;;
          esac
          remote_host="${SERVER_USER}@${SERVER_HOST}"
          printf -v remote_command 'flock -n %q bash -s -- %q %q %q %q %q' \
            '/home/apps/easonfansclub/.deploy.lock' '/home/apps/easonfansclub' \
            "${EXPECTED_PRODUCTION_SHA}" "${expected_version_code}" "${APK_SHA256}" "${APK_SIZE}"
          ssh_options=(
            -T -p "${SERVER_PORT}" -i "${RUNNER_TEMP}/easonfansclub_deploy_key"
            -o BatchMode=yes -o IdentitiesOnly=yes -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=10
          )
          timeout --foreground --signal=TERM --kill-after=10s 180s \
            ssh "${ssh_options[@]}" "${remote_host}" "${remote_command}" <<'REMOTE'
          set -euo pipefail
          APP_DIR="$1"
          EXPECTED_SHA="$2"
          EXPECTED_VERSION_CODE="$3"
          EXPECTED_APK_SHA256="$4"
          EXPECTED_APK_SIZE="$5"
          [[ "${APP_DIR}" == /home/apps/easonfansclub ]]
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_VERSION_CODE}" =~ ^(23|24|25)$ ]]
          [[ "${EXPECTED_APK_SHA256}" =~ ^[A-F0-9]{64}$ ]]
          [[ "${EXPECTED_APK_SIZE}" =~ ^[0-9]{8,9}$ ]]
          current_link="${APP_DIR}/current"
          [[ -L "${current_link}" ]] || { echo 'PRODUCTION_CURRENT_NOT_SYMLINK'; exit 1; }
          current_target="$(readlink -f -- "${current_link}")"
          case "${current_target}" in
            "${APP_DIR}/releases/"*) ;;
            *) echo 'PRODUCTION_CURRENT_OUTSIDE_RELEASES'; exit 1 ;;
          esac
          deployed_sha="$(cat "${current_target}/.deployed-sha")"
          [[ "${deployed_sha}" == "${EXPECTED_SHA}" ]] || { echo 'PRODUCTION_SHA_MISMATCH'; exit 1; }
          shared_env="$(readlink -f -- "${APP_DIR}/shared/.env")"
          release_env="$(readlink -f -- "${current_target}/.env")"
          [[ "${shared_env}" == "${release_env}" ]] || { echo 'PRODUCTION_ENV_LINK_MISMATCH'; exit 1; }
          node - "${current_target}" <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const path = require('node:path');
          const expectedCwd = fs.realpathSync(process.argv[2]);
          const apps = JSON.parse(execFileSync('pm2', ['jlist'], { encoding: 'utf8' }))
            .filter((app) => app.name === 'easonfansclub');
          if (apps.length !== 1 || apps[0].pm2_env?.status !== 'online') {
            throw new Error('WEB_PROCESS_NOT_UNIQUELY_ONLINE');
          }
          const actualCwd = fs.realpathSync(path.resolve(apps[0].pm2_env.pm_cwd));
          if (actualCwd !== expectedCwd) throw new Error('WEB_PROCESS_RELEASE_MISMATCH');
          process.stdout.write('WEB_PROCESS_PRECHECK=PASS\n');
          NODE
          timeout --foreground --signal=TERM --kill-after=10s 90s pm2 reload easonfansclub --update-env
          node - "${EXPECTED_SHA}" "${EXPECTED_VERSION_CODE}" "${EXPECTED_APK_SHA256}" "${EXPECTED_APK_SIZE}" <<'NODE'
          (async () => {
          const [expectedSha, expectedCode, expectedHash, expectedSize] = process.argv.slice(2);
          const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          for (let attempt = 0; attempt < 30; attempt += 1) {
            try {
              const health = await fetch('http://127.0.0.1:3000/api/health/live', { signal: AbortSignal.timeout(3000) });
              const healthBody = await health.json();
              const version = await fetch('http://127.0.0.1:3000/api/app/version?platform=android', { signal: AbortSignal.timeout(3000) });
              const versionBody = await version.json();
              if (health.ok && healthBody.release === expectedSha && version.ok
                && versionBody.versionName === '1.0.0-beta.21'
                && String(versionBody.versionCode) === expectedCode
                && Number(versionBody.minimumVersionCode) === 19
                && versionBody.forceUpdate === false
                && String(versionBody.size) === expectedSize
                && versionBody.apkSha256 === expectedHash) {
                process.stdout.write('PRODUCTION_HEALTH_SHA=' + healthBody.release + '\n');
                process.stdout.write('PRODUCTION_VERSION_CODE=' + versionBody.versionCode + '\n');
                process.stdout.write('WEB_PROCESS_RELOAD=PASS\n');
                return;
              }
            } catch {}
            await pause(2000);
          }
          throw new Error('PRODUCTION_METADATA_NOT_ACTIVE_AFTER_WEB_RELOAD');
          })().catch((error) => {
            process.stderr.write('PRODUCTION_METADATA_VERIFY_FAILED=' + String(error?.message || error) + '\n');
            process.exitCode = 1;
          });
          NODE
          REMOTE
