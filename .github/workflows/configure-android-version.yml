name: Configure Android version metadata

on:
  workflow_dispatch:
    inputs:
      expected_production_sha:
        description: Exact currently deployed production SHA (required; prevents stale config writes)
        required: true
        type: string
      release_candidate:
        description: Beta.21 RC3 through RC12 to publish for internal updates
        required: true
        type: choice
        options:
          - rc3
          - rc4
          - rc5
          - rc6
          - rc7
          - rc8
          - rc9
          - rc10
          - rc11
          - rc12
      apk_object_key:
        description: Immutable versioned Beta.21 RC object key created by the guarded COS staging workflow
        required: true
        type: string
      apk_sha256:
        description: Uppercase SHA-256 of the signed Beta.21 RC APK
        required: true
        type: string
      apk_size:
        description: Exact APK size in bytes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    name: Configure Beta.21 Android metadata without database access
    runs-on: ubuntu-22.04
    environment: Production
    timeout-minutes: 45
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Require protected current main before production metadata changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/assert-release-main.mjs

      - name: Verify final APK stored in COS
        env:
          APK_OBJECT_KEY: ${{ inputs.apk_object_key }}
          EXPECTED_SIZE: ${{ inputs.apk_size }}
          EXPECTED_SHA256: ${{ inputs.apk_sha256 }}
          RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_CANDIDATE}" == rc3 || "${RELEASE_CANDIDATE}" == rc4 || "${RELEASE_CANDIDATE}" == rc5 || "${RELEASE_CANDIDATE}" == rc6 || "${RELEASE_CANDIDATE}" == rc7 || "${RELEASE_CANDIDATE}" == rc8 || "${RELEASE_CANDIDATE}" == rc9 || "${RELEASE_CANDIDATE}" == rc10 || "${RELEASE_CANDIDATE}" == rc11 || "${RELEASE_CANDIDATE}" == rc12 ]] || { echo 'RELEASE_CANDIDATE_INVALID'; exit 1; }
          if [[ "${RELEASE_CANDIDATE}" == rc11 || "${RELEASE_CANDIDATE}" == rc12 ]]; then
            key_regex="^android/releases/ECFC-1\\.0\\.0-beta\\.21-release-beta21-${RELEASE_CANDIDATE}-[0-9]{8}-[0-9]{6}-run[0-9]+-attempt[1-9][0-9]*\\.apk$"
          else
            key_regex="^android/releases/ECFC-1\\.0\\.0-beta\\.21-release-beta21-${RELEASE_CANDIDATE}-[0-9]{8}-[0-9]{6}\\.apk$"
          fi
          [[ "${APK_OBJECT_KEY}" =~ ${key_regex} ]] || { echo 'APK_OBJECT_KEY_INVALID'; exit 1; }
          [[ "${EXPECTED_SIZE}" =~ ^[0-9]{8,9}$ ]] || { echo 'APK_SIZE_INVALID'; exit 1; }
          (( 10#${EXPECTED_SIZE} >= 10000000 && 10#${EXPECTED_SIZE} <= 500000000 )) || { echo 'APK_SIZE_OUT_OF_RANGE'; exit 1; }
          [[ "${EXPECTED_SHA256}" =~ ^[A-F0-9]{64}$ ]] || { echo 'APK_SHA256_INVALID'; exit 1; }
          if [[ "${RELEASE_CANDIDATE}" == rc11 ]]; then
            [[ "${EXPECTED_SIZE}" == 183802143 ]] || { echo 'RC11_APK_SIZE_MISMATCH'; exit 1; }
            [[ "${EXPECTED_SHA256}" == 9E620936CCBA72ACF81D811AA907800AD142873885D9E63C335E3465D39ADD6C ]] || { echo 'RC11_APK_SHA256_MISMATCH'; exit 1; }
          elif [[ "${RELEASE_CANDIDATE}" == rc12 ]]; then
            [[ "${EXPECTED_SIZE}" == 180263015 ]] || { echo 'RC12_APK_SIZE_MISMATCH'; exit 1; }
            [[ "${EXPECTED_SHA256}" == 50726672C4137610122DDFFC8650D3073D72B0F9E89CD0738B7CFDF85CA13271 ]] || { echo 'RC12_APK_SHA256_MISMATCH'; exit 1; }
          fi
          apk_url="https://media.ecfc.fans/media/${APK_OBJECT_KEY}"
          apk_path="${RUNNER_TEMP}/ecfc-beta21-${RELEASE_CANDIDATE}.apk"
          headers_path="${RUNNER_TEMP}/ecfc-beta21-${RELEASE_CANDIDATE}-cos-headers.txt"
          curl --fail --silent --show-error --location --max-time 2400 \
            --dump-header "${headers_path}" --output "${apk_path}" "${apk_url}"
          actual_size="$(stat -c '%s' "${apk_path}")"
          actual_sha256="$(sha256sum "${apk_path}" | awk '{print toupper($1)}')"
          [[ "${actual_size}" == "${EXPECTED_SIZE}" ]] || { echo 'COS_APK_SIZE_MISMATCH'; exit 1; }
          [[ "${actual_sha256}" == "${EXPECTED_SHA256}" ]] || { echo 'COS_APK_SHA256_MISMATCH'; exit 1; }
          range_status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' \
            --range 0-0 --max-time 30 "${apk_url}")"
          [[ "${range_status}" == 206 ]] || { echo 'COS_RANGE_REQUEST_NOT_206'; exit 1; }
          echo "COS_APK_SIZE=${actual_size}"
          echo "COS_APK_SHA256=${actual_sha256}"
          echo 'COS_RANGE_206=YES'

      - name: Validate RC11 signer and existing code30 rollback source
        if: inputs.release_candidate == 'rc11'
        id: rc11-baseline
        env:
          APK_OBJECT_KEY: ${{ inputs.apk_object_key }}
          EXPECTED_SHA256: ${{ inputs.apk_sha256 }}
          EXPECTED_SIZE: ${{ inputs.apk_size }}
          CODE30_ROLLBACK_OBJECT_KEY: android/releases/ECFC-1.0.0-beta.21-code30-backup-20261102-205634-run41523510243-attempt1.apk
        run: |
          set -euo pipefail
          expected_signer='12954323F60A594D2AB69DCB93112E8EB0A63344B11C03DAB5FCCA51A3FCD52B'
          expected_code30_sha='D2CA0817E23431EFAB87E992BA544C4B213981E3E8651D67AF49324B440FC967'
          expected_code30_size='184246197'
          [[ "${CODE30_ROLLBACK_OBJECT_KEY}" == 'android/releases/ECFC-1.0.0-beta.21-code30-backup-20261102-205634-run41523510243-attempt1.apk' ]] || { echo 'CODE30_ROLLBACK_SOURCE_INVALID'; exit 1; }

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [[ -n "${sdk_root}" && -d "${sdk_root}/build-tools" ]] || { echo 'ANDROID_BUILD_TOOLS_NOT_AVAILABLE'; exit 1; }
          apksigner="$(find "${sdk_root}/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          aapt="$(find "${sdk_root}/build-tools" -maxdepth 2 -type f -name aapt -print | sort -V | tail -n 1)"
          [[ -x "${apksigner}" && -x "${aapt}" ]] || { echo 'ANDROID_APK_VALIDATION_TOOLS_NOT_AVAILABLE'; exit 1; }

          verify_apk() {
            local apk_path="$1" expected_code="$2" expected_sha="$3" expected_size="$4" label="$5"
            local actual_sha actual_size signer badging
            actual_sha="$(sha256sum "${apk_path}" | awk '{print toupper($1)}')"
            actual_size="$(stat -c '%s' "${apk_path}")"
            [[ "${actual_sha}" == "${expected_sha}" ]] || { echo "${label}_SHA256_MISMATCH"; exit 1; }
            [[ "${actual_size}" == "${expected_size}" ]] || { echo "${label}_SIZE_MISMATCH"; exit 1; }
            node scripts/verify-android-apk-signature.mjs "${apksigner}" "${apk_path}" "${expected_signer}"
            badging="$("${aapt}" dump badging "${apk_path}" | head -n 3)"
            [[ "${badging}" == *"package: name='fans.ecfc.app' versionCode='${expected_code}' versionName='1.0.0-beta.21'"* ]] || { echo "${label}_PACKAGE_VERSION_MISMATCH"; exit 1; }
            [[ "${badging}" == *"sdkVersion:'24'"* && "${badging}" == *"targetSdkVersion:'36'"* ]] || { echo "${label}_SDK_METADATA_MISMATCH"; exit 1; }
          }

          rc11_apk="${RUNNER_TEMP}/ecfc-beta21-rc11.apk"
          verify_apk "${rc11_apk}" 31 9E620936CCBA72ACF81D811AA907800AD142873885D9E63C335E3465D39ADD6C 183802143 RC11
          echo 'RC11_PACKAGE=fans.ecfc.app'
          echo 'RC11_VERSION_CODE=31'
          echo 'RC11_VERSION_NAME=1.0.0-beta.21'
          echo 'RC11_SIGNATURE=VERIFIED'

          api_json="${RUNNER_TEMP}/ecfc-version-api-before.json"
          curl --fail --silent --show-error --location --max-time 30 \
            'https://ecfc.fans/api/app/version?platform=android' --output "${api_json}"
          jq -e --arg sha "${expected_code30_sha}" --argjson size "${expected_code30_size}" '
            .platform == "android" and .versionName == "1.0.0-beta.21" and .versionCode == 30
            and .minimumVersionCode == 19 and .forceUpdate == false
            and (.apkSha256 | ascii_upcase) == $sha and .size == $size
            and .downloadUrl == "https://ecfc.fans/api/app/download/android"
            and (.releaseNotes | type == "array" and length == 6)
            and .publishedAt != null
          ' "${api_json}" >/dev/null || { echo 'PRODUCTION_VERSION_API_NOT_EXPECTED_CODE30'; exit 1; }

          code30_source="${RUNNER_TEMP}/ecfc-beta21-code30-source.apk"
          source_url="$(jq -r '.downloadUrl' "${api_json}")"
          curl --fail --silent --show-error --location --max-time 2400 \
            --output "${code30_source}" "${source_url}"
          verify_apk "${code30_source}" 30 "${expected_code30_sha}" "${expected_code30_size}" CODE30_SOURCE

          code30_rollback="${RUNNER_TEMP}/ecfc-beta21-code30-rollback.apk"
          rollback_url="https://media.ecfc.fans/media/${CODE30_ROLLBACK_OBJECT_KEY}"
          curl --fail --silent --show-error --location --max-time 2400 \
            --output "${code30_rollback}" "${rollback_url}"
          verify_apk "${code30_rollback}" 30 "${expected_code30_sha}" "${expected_code30_size}" CODE30_ROLLBACK_SOURCE
          [[ "$(realpath "${code30_rollback}")" != "$(realpath "${rc11_apk}")" ]]

          cp "${api_json}" "${RUNNER_TEMP}/android-version-api-before.json"
          printf 'CODE30_ROLLBACK_OBJECT_KEY=%s\n' "${CODE30_ROLLBACK_OBJECT_KEY}" >> "${GITHUB_OUTPUT}"
          printf 'VERSION_API_BASELINE_FILE=%s\n' "${api_json}" >> "${GITHUB_OUTPUT}"
          echo 'CODE30_CURRENT_DOWNLOAD=VERIFIED'
          echo 'CODE30_ROLLBACK_SOURCE_VERIFIED=YES'
          echo 'RC11_PACKAGE_SIGNER_METADATA=VERIFIED'

      - name: Validate RC12 signer and original code31 rollback source
        if: inputs.release_candidate == 'rc12'
        id: rc12-baseline
        env:
          APK_OBJECT_KEY: ${{ inputs.apk_object_key }}
          EXPECTED_SHA256: ${{ inputs.apk_sha256 }}
          EXPECTED_SIZE: ${{ inputs.apk_size }}
          CODE31_ROLLBACK_OBJECT_KEY: android/releases/ECFC-1.0.0-beta.21-release-beta21-rc11-20261102-205722-run41523510243-attempt1.apk
        run: |
          set -euo pipefail
          expected_signer='12954323F60A594D2AB69DCB93112E8EB0A63344B11C03DAB5FCCA51A3FCD52B'
          expected_code31_sha='9E620936CCBA72ACF81D811AA907800AD142873885D9E63C335E3465D39ADD6C'
          expected_code31_size='183802143'
          [[ "${CODE31_ROLLBACK_OBJECT_KEY}" == 'android/releases/ECFC-1.0.0-beta.21-release-beta21-rc11-20261102-205722-run41523510243-attempt1.apk' ]] || { echo 'CODE31_ROLLBACK_SOURCE_INVALID'; exit 1; }

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [[ -n "${sdk_root}" && -d "${sdk_root}/build-tools" ]] || { echo 'ANDROID_BUILD_TOOLS_NOT_AVAILABLE'; exit 1; }
          apksigner="$(find "${sdk_root}/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          aapt="$(find "${sdk_root}/build-tools" -maxdepth 2 -type f -name aapt -print | sort -V | tail -n 1)"
          [[ -x "${apksigner}" && -x "${aapt}" ]] || { echo 'ANDROID_APK_VALIDATION_TOOLS_NOT_AVAILABLE'; exit 1; }

          verify_apk() {
            local apk_path="$1" expected_code="$2" expected_sha="$3" expected_size="$4" label="$5"
            local actual_sha actual_size signer badging
            actual_sha="$(sha256sum "${apk_path}" | awk '{print toupper($1)}')"
            actual_size="$(stat -c '%s' "${apk_path}")"
            [[ "${actual_sha}" == "${expected_sha}" ]] || { echo "${label}_SHA256_MISMATCH"; exit 1; }
            [[ "${actual_size}" == "${expected_size}" ]] || { echo "${label}_SIZE_MISMATCH"; exit 1; }
            node scripts/verify-android-apk-signature.mjs "${apksigner}" "${apk_path}" "${expected_signer}"
            badging="$("${aapt}" dump badging "${apk_path}" | head -n 3)"
            [[ "${badging}" == *"package: name='fans.ecfc.app' versionCode='${expected_code}' versionName='1.0.0-beta.21'"* ]] || { echo "${label}_PACKAGE_VERSION_MISMATCH"; exit 1; }
            [[ "${badging}" == *"sdkVersion:'24'"* && "${badging}" == *"targetSdkVersion:'36'"* ]] || { echo "${label}_SDK_METADATA_MISMATCH"; exit 1; }
          }

          rc12_apk="${RUNNER_TEMP}/ecfc-beta21-rc12.apk"
          verify_apk "${rc12_apk}" 32 50726672C4137610122DDFFC8650D3073D72B0F9E89CD0738B7CFDF85CA13271 180263015 RC12
          echo 'RC12_PACKAGE=fans.ecfc.app'
          echo 'RC12_VERSION_CODE=32'
          echo 'RC12_VERSION_NAME=1.0.0-beta.21'
          echo 'RC12_SIGNATURE=VERIFIED'

          api_json="${RUNNER_TEMP}/ecfc-version-api-before.json"
          curl --fail --silent --show-error --location --max-time 30 \
            'https://ecfc.fans/api/app/version?platform=android' --output "${api_json}"
          jq -e --arg sha "${expected_code31_sha}" --argjson size "${expected_code31_size}" '
            .platform == "android" and .versionName == "1.0.0-beta.21" and .versionCode == 31
            and .minimumVersionCode == 19 and .forceUpdate == false
            and (.apkSha256 | ascii_upcase) == $sha and .size == $size
            and .downloadUrl == "https://ecfc.fans/api/app/download/android"
            and (.releaseNotes | type == "array" and length == 6)
            and .releaseNotes[5] == "Beta.21 RC11 内测版本"
            and .publishedAt != null
          ' "${api_json}" >/dev/null || { echo 'PRODUCTION_VERSION_API_NOT_EXPECTED_CODE31'; exit 1; }

          code31_source="${RUNNER_TEMP}/ecfc-beta21-code31-rollback-source.apk"
          source_url="$(jq -r '.downloadUrl' "${api_json}")"
          expected_rollback_url="https://media.ecfc.fans/media/${CODE31_ROLLBACK_OBJECT_KEY}"
          actual_source_url="$(curl --fail --silent --show-error --location --max-time 2400 \
            --write-out '%{url_effective}' --output "${code31_source}" "${source_url}")"
          [[ "${actual_source_url}" == "${expected_rollback_url}" ]] || { echo 'CODE31_ROLLBACK_SOURCE_URL_MISMATCH'; exit 1; }
          verify_apk "${code31_source}" 31 "${expected_code31_sha}" "${expected_code31_size}" CODE31_ROLLBACK_SOURCE
          [[ "$(realpath "${code31_source}")" != "$(realpath "${rc12_apk}")" ]]

          cp "${api_json}" "${RUNNER_TEMP}/android-version-api-before.json"
          printf 'CODE31_ROLLBACK_OBJECT_KEY=%s\n' "${CODE31_ROLLBACK_OBJECT_KEY}" >> "${GITHUB_OUTPUT}"
          printf 'VERSION_API_BASELINE_FILE=%s\n' "${api_json}" >> "${GITHUB_OUTPUT}"
          echo 'CODE31_CURRENT_DOWNLOAD=VERIFIED'
          echo 'CODE31_ROLLBACK_SOURCE_VERIFIED=YES'
          echo 'RC12_PACKAGE_SIGNER_METADATA=VERIFIED'
      - name: Preserve RC12 release baseline snapshot
        if: inputs.release_candidate == 'rc12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-beta21-rc12-release-baseline
          path: ${{ runner.temp }}/android-version-api-before.json
          if-no-files-found: error
          retention-days: 90

      - name: Preserve RC11 release baseline snapshot
        if: inputs.release_candidate == 'rc11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-beta21-rc11-release-baseline
          path: ${{ runner.temp }}/android-version-api-before.json
          if-no-files-found: error
          retention-days: 90

      - name: Validate pinned production SSH settings
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          PINNED_HOST_KEY_SHA256: ${{ vars.PRODUCTION_SSH_HOST_KEY_SHA256 }}
          EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
        run: |
          set -euo pipefail
          for name in SERVER_HOST SERVER_USER SERVER_PORT SERVER_SSH_KEY PINNED_HOST_KEY_SHA256 EXPECTED_PRODUCTION_SHA; do
            [[ -n "${!name:-}" ]] || { echo "::error::Required protected setting ${name} is missing."; exit 1; }
          done
          [[ "${SERVER_HOST}" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "${SERVER_USER}" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "${SERVER_PORT}" =~ ^[0-9]{1,5}$ ]]
          (( 10#${SERVER_PORT} >= 1 && 10#${SERVER_PORT} <= 65535 ))
          [[ "${PINNED_HOST_KEY_SHA256}" =~ ^SHA256:[A-Za-z0-9+/]+=?$ ]]
          [[ "${EXPECTED_PRODUCTION_SHA}" =~ ^[0-9a-f]{40}$ ]]
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SERVER_SSH_KEY}" | tr -d '\r' > "${RUNNER_TEMP}/easonfansclub_deploy_key"
          chmod 600 "${RUNNER_TEMP}/easonfansclub_deploy_key"
          scan_file="${RUNNER_TEMP}/host-scan"
          verified_file="${RUNNER_TEMP}/known-hosts"
          key_line_file="${RUNNER_TEMP}/key-line"
          timeout 30s ssh-keyscan -T 15 -p "${SERVER_PORT}" -H "${SERVER_HOST}" > "${scan_file}" 2>/dev/null
          : > "${verified_file}"
          while IFS= read -r entry; do
            [[ -n "${entry}" && "${entry}" != \#* ]] || continue
            printf '%s\n' "${entry}" > "${key_line_file}"
            fingerprint="$(ssh-keygen -lf "${key_line_file}" -E sha256 | awk 'NR == 1 {print $2}')"
            if [[ "${fingerprint}" == "${PINNED_HOST_KEY_SHA256}" ]]; then printf '%s\n' "${entry}" >> "${verified_file}"; fi
          done < "${scan_file}"
          [[ -s "${verified_file}" ]] || { echo '::error::Production SSH host key fingerprint mismatch.'; exit 1; }
          ssh-keygen -lf "${verified_file}" -E sha256 | awk '{print $2}' | grep -Fx -- "${PINNED_HOST_KEY_SHA256}" >/dev/null
          install -m 600 "${verified_file}" "${HOME}/.ssh/known_hosts"
          echo 'PRODUCTION_SSH_HOST_PIN=VERIFIED'

      - name: Update only Android version variables in production shared env
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
          APK_OBJECT_KEY: ${{ inputs.apk_object_key }}
          EXPECTED_SHA256: ${{ inputs.apk_sha256 }}
          EXPECTED_SIZE: ${{ inputs.apk_size }}
          RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
          CODE30_ROLLBACK_OBJECT_KEY: ${{ steps.rc11-baseline.outputs.CODE30_ROLLBACK_OBJECT_KEY }}
          CODE31_ROLLBACK_OBJECT_KEY: ${{ steps.rc12-baseline.outputs.CODE31_ROLLBACK_OBJECT_KEY }}
        run: |
          set -euo pipefail
          case "${RELEASE_CANDIDATE}" in
            rc3)
              version_code=23
              notes='["分享卡展示帖子原图、作者头像和正式品牌资源","图片分享同时提供说明文字与规范公开链接","二维码和分享文案使用同一公开网址","每日处方分享与更新下载体验改进","RC3 内测修复","Beta.21 RC3 内测版本"]'
              ;;
            rc4)
              version_code=24
              notes='["分享入口提供私信、图片和链接三种独立方式","好友分享复用站内通讯录和私信","图片分享仅在选择后生成带二维码卡片","链接分享直接提供规范 HTTPS 网页地址","每日处方分享导出改为按需生成","Beta.21 RC4 内测版本"]'
              ;;
            rc5)
              version_code=25
              notes='["修复活跃症任务导航空路由","新增反馈与更新并接入现有反馈 API","App 启动时静默检查更新并复用现有更新器","个人主页扫码入口新增我的二维码和扫一扫","产品名称更新为番茄酱牛腩面不吃辣","Beta.21 RC5 内测版本"]'
              ;;
            rc6)
              version_code=26
              notes='["修复活跃症任务点击后的目标页面跳转","启用 E院中心现有反馈与更新入口","移除我的二维码头像上方重复的品牌标志","启动时每个应用会话最多自动检查一次更新","保留现有反馈接口与二维码扫描流程","Beta.21 RC6 内测版本"]'
              ;;
            rc7)
              version_code=27
              notes='["支持意见反馈添加最多 9 张图片","修复活跃症任务导航并补充真实点击回归检查","补充活动中心核销二维码与管理员扫码入口","优化广场滑动切换和每日处方分享","统一普通页面提示并移除技术实现文案","Beta.21 RC7 内测版本"]'
              ;;
            rc8)
              version_code=28
              notes='["修复帖子点赞、分享和回复任务的页面跳转","补全活动核销状态、用户二维码及管理员扫码入口","修正普通用户发帖分类权限与默认分类","恢复广场好友、推荐、最新横向滑动切换","接入与网站数据一致的原生 EasMusic 功能","Beta.21 RC8 内测版本"]'
              ;;
            rc9)
              version_code=29
              notes='["统一多账号会话并修复反馈、账号安全和物料入口状态","恢复授权用户公告发布权限并保持普通用户入口隐藏","修复演唱会详情崩溃并完善 EasMusic 导航","广场好友、推荐、最新支持跟手分页并保留各自状态","活动报名后自动兑换绑定物料并复用现有发放记录","Beta.21 RC9 内测版本"]'
              ;;
            rc10)
              version_code=30
              notes='["修复反馈、多账号和账号安全的登录状态处理","恢复授权用户公告发布权限并保持普通用户入口隐藏","修复演唱会详情闪退并完善活跃症任务跳转","活动报名后自动发放绑定物料并复用现有兑换记录","完善设置退出登录及用户提示文案","Beta.21 RC10 内测版本"]'
              ;;
            rc11)
              version_code=31
