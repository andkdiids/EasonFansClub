          [[ "$web_status" == online && "$web_pid" =~ ^[1-9][0-9]* && "$web_cwd" == "$current_link" ]] || fail PM2_WEB_NOT_ON_CURRENT
          web_actual="$(readlink "/proc/$web_pid/cwd" 2>/dev/null || true)"
