            try { productionTree = readTree(path.join(process.env.CURRENT_RELEASE, 'prisma/migrations')) }
            catch { fail('PRODUCTION_MIGRATION_TREE_UNAVAILABLE') }
            const candidateTree = new Map(candidate.map(x => [x.name, x.checksum]))
            let databaseUrl
            let PrismaClient
            try {
              const release = process.env.CURRENT_RELEASE
