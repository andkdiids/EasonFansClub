          printf 'PRODUCTION_SHA=%s\nCURRENT_RELEASE=%s\nROLLBACK_SHA=%s\nROLLBACK_RELEASE=%s\n' "$production_sha" "$current_target" "$production_sha" "$current_target"
          printf 'DEPLOY_LOCK=SHARED_READ_LOCK_ACQUIRED\n'
