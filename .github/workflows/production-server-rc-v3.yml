              ;({ PrismaClient } = require(path.join(release, 'node_modules/@prisma/client')))
            } catch { fail('DATABASE_CONFIGURATION_OR_PRISMA_UNAVAILABLE') }
            const client = new PrismaClient({ log: [] })
            try {
              await client.$connect()
              const rows = await client.$queryRawUnsafe('SELECT migration_name, checksum, started_at, finished_at, rolled_back_at FROM _prisma_migrations')
              if (!Array.isArray(rows)) fail('MIGRATION_LEDGER_INVALID')
              const byName = new Map()
              for (const row of rows) {
                if (typeof row.migration_name !== 'string' || !/^[0-9a-f]{64}$/.test(String(row.checksum || ''))) fail('MIGRATION_LEDGER_INVALID')
