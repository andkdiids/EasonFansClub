          [[ "$app_dir" == /home/apps/easonfansclub ]] || fail APP_PATH_MISMATCH
          [[ "$candidate_sha" == 2b6d06b630dfed7e8ce6e518e10bda52b919af8b ]] || fail CANDIDATE_SHA_MISMATCH
          [[ "$candidate_b64" =~ ^[A-Za-z0-9+/=]+$ && ${#candidate_b64} -le 65536 ]] || fail MIGRATION_MANIFEST_INVALID
