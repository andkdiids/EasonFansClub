            const resolved = fs.realpathSync(root)
            const out = new Map()
            for (const name of fs.readdirSync(resolved).sort()) {
              if (name === 'migration_lock.toml') {
                const lock = fs.lstatSync(path.join(resolved, name))
                if (!lock.isFile() || lock.isSymbolicLink()) fail('MIGRATION_FILE_UNSAFE')
                continue
              }
              if (!/^\d{14}_[A-Za-z0-9_]+$/.test(name)) fail('MIGRATION_NAME_INVALID')
              const dir = path.join(resolved, name)
              const file = path.join(dir, 'migration.sql')
              const ds = fs.lstatSync(dir), ss = fs.lstatSync(file)
              if (!ds.isDirectory() || ds.isSymbolicLink() || !ss.isFile() || ss.isSymbolicLink() || ss.size > 2 * 1024 * 1024) fail('MIGRATION_FILE_UNSAFE')
              out.set(name, crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex'))
            }
