                  if (String(run.id) === current) continue
                  const path = typeof run.path === 'string' ? run.path.split('@', 1)[0] : ''
                  if (!path) throw new Error()
                  if (!knownPaths.has(path)) throw new Error()
                  if (protectedPaths.has(path)) conflicts++
                }
