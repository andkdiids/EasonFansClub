          ACTIVE_SHA: ${{ steps.rollback.outputs.verified_sha }}
        run: |
          set -euo pipefail
          [[ "$ACTIVE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Active rollback SHA is invalid."; exit 1; }
          url="https://${PRODUCTION_DOMAIN}/api/health/live"
          for attempt in 1 2 3 4 5; do
            response="$(curl --fail --location --proto '=https' --proto-redir '=https' --silent --show-error \
              --connect-timeout 10 --max-time 20 "$url" 2>/dev/null || true)"
            if printf '%s' "$response" | node -e '
              let raw="";process.stdin.on("data",c=>{raw+=c;if(raw.length>16384)process.exit(1)});process.stdin.on("end",()=>{try{process.exit(JSON.parse(raw).release===process.argv[1]?0:1)}catch{process.exit(1)}})
            ' "$ACTIVE_SHA"; then
              echo "ROLLBACK_PUBLIC_HEALTH_SHA=$ACTIVE_SHA"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Public HTTPS does not serve the verified active SHA after rollback."
          exit 1

      - name: Remove temporary runner SSH credentials
        id: cleanup_ssh
        if: always()
        shell: bash
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          HOSTS_FILE: ${{ steps.ssh.outputs.hosts_file }}
        run: |
          set -euo pipefail
          for file in "$KEY_FILE" "$HOSTS_FILE"; do
            case "$file" in "$RUNNER_TEMP"/ecfc-server-v3-*.key|"$RUNNER_TEMP"/ecfc-server-v3-*.hosts) rm -f -- "$file" ;; esac
          done

      - name: Require every post-deploy release gate before declaring success
        id: final_release_gate
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.deploy.outcome }}" == success ]] || { echo "::error::Deploy step did not succeed."; exit 1; }
          [[ "${{ steps.migration_postcheck.outcome }}" == success && "${{ steps.migration_postcheck.outputs.post_deploy_migration_check }}" == PASS ]] || { echo "::error::Post-deploy migration gate did not succeed."; exit 1; }
          [[ "${{ steps.migration_postcheck.outputs.pending_count }}" == 0 && "${{ steps.migration_postcheck.outputs.failed_count }}" == 0 && "${{ steps.migration_postcheck.outputs.divergence }}" == NO && "${{ steps.migration_postcheck.outputs.unexpected_pending_migrations }}" == 0 && "${{ steps.migration_postcheck.outputs.approved_migration_1 }}" == APPLIED && "${{ steps.migration_postcheck.outputs.approved_migration_2 }}" == APPLIED ]] || { echo "::error::Post-deploy migration evidence is incomplete."; exit 1; }
          [[ "${{ steps.runtime_postcheck.outcome }}" == success && "${{ steps.runtime_postcheck.outputs.pm2_web }}" == ONLINE && "${{ steps.runtime_postcheck.outputs.pm2_worker }}" == UNCHANGED ]] || { echo "::error::Runtime preservation gate did not succeed."; exit 1; }
          [[ "${{ steps.public_health.outcome }}" == success && "${{ steps.public_health.outputs.public_health_sha }}" == "$CANDIDATE_SHA" ]] || { echo "::error::Exact public health gate did not succeed."; exit 1; }
          [[ "${{ steps.cleanup_ssh.outcome }}" == success ]] || { echo "::error::Temporary SSH credential cleanup did not succeed."; exit 1; }
          echo "PUBLIC_HEALTH_SHA=$CANDIDATE_SHA"
          echo 'POST_DEPLOY_MIGRATION_CHECK=PASS'
          echo 'PENDING_COUNT=0'
          echo 'FAILED_COUNT=0'
          echo 'DIVERGENCE=NO'
          echo 'UNEXPECTED_PENDING_MIGRATIONS=0'
          echo 'APPROVED_MIGRATION_1=APPLIED'
          echo 'APPROVED_MIGRATION_2=APPLIED'
          echo 'PM2_WEB=ONLINE'
          echo 'PM2_WORKER=UNCHANGED'
          echo 'RELEASE_SUCCESS=YES'
