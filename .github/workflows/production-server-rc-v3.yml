name: One-time Production Release — Mobile Server RC V3

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Serialize with production deployments; the server flock remains the final lock.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  APP_DIR: /home/apps/easonfansclub
  APP_PORT: "3000"
  PRODUCTION_DOMAIN: ecfc.fans
  CANDIDATE_BRANCH: integration/mobile-server-rc-v3
  CANDIDATE_SHA: 2b6d06b630dfed7e8ce6e518e10bda52b919af8b
  ORIGINAL_MAIN_BASE_SHA: 1a0c8b9d85c7aa61f5a70e37bcdee563b5bff063
  FIRST_WORKFLOW_INSTALL_SHA: 97c4fa066f32e02d0dbc0f5c47df53678c3d3ddc
  AUDITED_WORKFLOW_PARENT_SHA: 483dfe0b55f7faeb3a3405fd1159a859a7cc0309
  DB_BACKUP_CONFIRMED: "YES"
  BACKUP_CONFIRMATION_SOURCE: "MANUAL_OWNER_CONFIRMATION"

jobs:
  release:
    name: Reconcile and release the exact Server RC V3
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    environment:
      name: Production
    permissions:
      contents: read
      actions: read

    steps:
      - name: Require manual dispatch from main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || { echo "::error::Manual dispatch only."; exit 1; }
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::Dispatch from main only."; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid workflow source SHA."; exit 1; }

      - name: Require the owner-confirmed recoverable database backup
        id: backup_gate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DB_BACKUP_CONFIRMED" == "YES" ]] || { echo "::error::Database backup prerequisite is not confirmed."; exit 1; }
          [[ "$BACKUP_CONFIRMATION_SOURCE" == "MANUAL_OWNER_CONFIRMATION" ]] || { echo "::error::Database backup confirmation source is invalid."; exit 1; }
          printf 'DB_BACKUP_CONFIRMED=%s\n' "$DB_BACKUP_CONFIRMED"
          printf 'BACKUP_CONFIRMATION_SOURCE=%s\n' "$BACKUP_CONFIRMATION_SOURCE"
          echo 'DB_BACKUP_GATE=PASS'

      - name: Checkout the exact workflow source from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified checkout v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify audited workflow chain, main ref, RC ref, and fixed candidate ancestry
        id: refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo "::error::Workflow checkout SHA mismatch."; exit 1; }
          [[ "$CANDIDATE_SHA" == 2b6d06b630dfed7e8ce6e518e10bda52b919af8b ]] || { echo "::error::Candidate SHA policy mismatch."; exit 1; }
          [[ "$CANDIDATE_BRANCH" == integration/mobile-server-rc-v3 ]] || { echo "::error::Candidate branch policy mismatch."; exit 1; }
          git merge-base --is-ancestor "$ORIGINAL_MAIN_BASE_SHA" "$CANDIDATE_SHA" || { echo "::error::Candidate does not contain the audited main base."; exit 1; }
          node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const api = process.env.GITHUB_API_URL
          const repo = process.env.GITHUB_REPOSITORY
          const token = process.env.GH_TOKEN
          const expectedMain = process.env.GITHUB_SHA
          const expectedCandidate = process.env.CANDIDATE_SHA
          const branch = process.env.CANDIDATE_BRANCH
          const originalBase = process.env.ORIGINAL_MAIN_BASE_SHA
          const firstInstall = process.env.FIRST_WORKFLOW_INSTALL_SHA
          const auditedParent = process.env.AUDITED_WORKFLOW_PARENT_SHA
          const workflowPath = '.github/workflows/production-server-rc-v3.yml'
          const headers = {
            accept: 'application/vnd.github+json',
            authorization: 'Bearer ' + token,
            'x-github-api-version': '2022-11-28',
          }
          function git(args) {
            return execFileSync('git', args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }).trim()
          }
          function requireSingleParent(commit, expectedParent) {
            const parents = git(['show', '-s', '--format=%P', commit]).split(/\s+/).filter(Boolean)
            if (parents.length !== 1 || parents[0] !== expectedParent) throw new Error('audited parent mismatch')
          }
          function requireOnlyWorkflowChanged(range) {
            const changed = git(['diff', '--name-only', '--no-renames', range]).split(/\r?\n/).filter(Boolean).sort()
            if (changed.length !== 1 || changed[0] !== workflowPath) throw new Error('unexpected workflow chain path')
          }
          function verifyWorkflowChain() {
            for (const sha of [expectedMain, originalBase, firstInstall, auditedParent]) {
              if (!/^[0-9a-f]{40}$/.test(sha || '')) throw new Error('workflow chain SHA shape mismatch')
            }
            if (git(['rev-parse', 'HEAD']) !== expectedMain) throw new Error('workflow checkout SHA mismatch')
            requireSingleParent(firstInstall, originalBase)
            requireOnlyWorkflowChanged(`${originalBase}..${firstInstall}`)
            requireSingleParent(auditedParent, firstInstall)
            requireOnlyWorkflowChanged(`${firstInstall}..${auditedParent}`)
            requireSingleParent(expectedMain, auditedParent)
            requireOnlyWorkflowChanged(`${auditedParent}..${expectedMain}`)
            requireOnlyWorkflowChanged(`${originalBase}..${expectedMain}`)
          }
          async function getRef(name) {
            const response = await fetch(`${api}/repos/${repo}/git/ref/heads/${name.split('/').map(encodeURIComponent).join('/')}`, { headers })
            if (!response.ok) throw new Error('ref check failed')
            const data = await response.json()
            if (!/^[0-9a-f]{40}$/.test(data.object?.sha || '')) throw new Error('ref shape failed')
            return data.object.sha
          }
          async function main() {
            verifyWorkflowChain()
            if (await getRef('main') !== expectedMain) throw new Error('main moved after workflow dispatch')
            if (await getRef(branch) !== expectedCandidate) throw new Error('approved RC branch head mismatch')
            console.log('WORKFLOW_SOURCE=MAIN_AUDITED_WORKFLOW_CHAIN')
            console.log('REMOTE_MAIN_SHA_MATCH=YES')
            console.log('REMOTE_RC_HEAD_MATCH=YES')
          }
          main().catch(() => { console.error('::error::Audited workflow chain or remote branch identity could not be verified.'); process.exitCode = 1 })
          NODE

      - name: Checkout the immutable RC source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified checkout v4
        with:
          ref: 2b6d06b630dfed7e8ce6e518e10bda52b919af8b
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Verify candidate checkout and build a checksum-only migration manifest
        id: migrations
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C candidate rev-parse HEAD)" == "$CANDIDATE_SHA" ]] || { echo "::error::Candidate checkout SHA mismatch."; exit 1; }
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const crypto = require('node:crypto')
          const root = path.resolve('candidate/prisma/migrations')
          const out = process.env.GITHUB_OUTPUT
          const approved = new Set([
            '20261022090000_profile_mobile_contract',
            '20261023090000_cantonese_question_progress',
          ])
          const requiredExisting = new Set([
            '20261013100000_add_topic_activity_v2_web',
            '20261013120000_add_topic_activity_v2_lottery',
            '20261013121000_add_topic_lottery_winner_slot_column',
            '20261013122000_add_topic_lottery_winner_slot_index',
            '20261013123000_add_topic_lottery_winner_slot_fk',
          ])
          try {
            if (!fs.lstatSync(root).isDirectory() || fs.lstatSync(root).isSymbolicLink()) throw new Error()
            const entries = fs.readdirSync(root).sort()
            if (!entries.length) throw new Error()
            const migrations = []
            for (const name of entries) {
              if (name === 'migration_lock.toml') {
                const lock = fs.lstatSync(path.join(root, name))
                if (!lock.isFile() || lock.isSymbolicLink()) throw new Error()
                continue
              }
              if (name === 'README.md') {
                const readme = fs.lstatSync(path.join(root, name))
                if (!readme.isFile() || readme.isSymbolicLink() || readme.size > 64 * 1024) throw new Error()
                continue
              }
              if (!/^\d{14}_[A-Za-z0-9_]+$/.test(name)) throw new Error()
              const directory = path.join(root, name)
              const sql = path.join(directory, 'migration.sql')
              const ds = fs.lstatSync(directory)
              const ss = fs.lstatSync(sql)
              if (!ds.isDirectory() || ds.isSymbolicLink() || !ss.isFile() || ss.isSymbolicLink() || ss.size > 2 * 1024 * 1024) throw new Error()
              const bytes = fs.readFileSync(sql)
              migrations.push({ name, checksum: crypto.createHash('sha256').update(bytes).digest('hex') })
            }
            for (const name of approved) if (!migrations.some(item => item.name === name)) throw new Error()
            for (const name of requiredExisting) if (!migrations.some(item => item.name === name)) throw new Error()
            const payload = Buffer.from(JSON.stringify(migrations)).toString('base64')
            if (payload.length > 65536) throw new Error()
            fs.appendFileSync(out, `candidate_migrations_b64=${payload}\n`)
            fs.appendFileSync(out, `candidate_migration_count=${migrations.length}\n`)
            console.log(`RC_SHA=${process.env.CANDIDATE_SHA}`)
            console.log(`RC_MIGRATION_COUNT=${migrations.length}`)
            console.log('APPROVED_MIGRATION_SET_PRESENT=YES')
          } catch {
            console.error('::error::Candidate migration tree is unsafe or incomplete.')
            process.exitCode = 1
          }
          NODE

      - name: Reject non-additive approved migration SQL before SSH
        id: migration_sql_safety
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const root = path.resolve('candidate/prisma/migrations')
          const specs = new Map([
            ['20261022090000_profile_mobile_contract', ['ALTER_ADD_COLUMN', 'CREATE_TABLE']],
            ['20261023090000_cantonese_question_progress', ['CREATE_TABLE']],
          ])
          function fail() { throw new Error('unsafe migration SQL') }
          function word(token, value) { return token?.kind === 'word' && token.value === value }
          function identifier(token) { return token?.kind === 'identifier' }
          function lex(sql) {
            if (/\b(?:PREPARE|EXECUTE)\b/i.test(sql)) fail()
            const statements = []
            let current = []
            for (let i = 0; i < sql.length;) {
              const ch = sql[i]
              if (/\s/.test(ch)) { i++; continue }
              if (sql.startsWith('/*', i)) {
                if (sql.startsWith('/*!', i) || sql.startsWith('/*+', i)) fail()
                const end = sql.indexOf('*/', i + 2)
                if (end < 0) fail()
                i = end + 2
                continue
              }
              if (ch === '#' || (sql.startsWith('--', i) && (i + 2 === sql.length || /\s/.test(sql[i + 2])))) {
                const end = sql.indexOf('\n', i)
                i = end < 0 ? sql.length : end + 1
                continue
              }
              if (ch === '`') {
                let value = ''
                i++
                let closed = false
                while (i < sql.length) {
                  if (sql[i] === '`' && sql[i + 1] === '`') { value += '`'; i += 2; continue }
                  if (sql[i] === '`') { i++; closed = true; break }
                  if (sql[i] === '\n' || sql[i] === '\r') fail()
                  value += sql[i++]
                }
                if (!closed || !value) fail()
                current.push({ kind: 'identifier', value })
                continue
              }
              if (ch === "'" || ch === '"') {
                const quote = ch
                i++
                let closed = false
                while (i < sql.length) {
                  if (sql[i] === '\\') { i += 2; continue }
                  if (sql[i] === quote && sql[i + 1] === quote) { i += 2; continue }
                  if (sql[i] === quote) { i++; closed = true; break }
                  i++
                }
                if (!closed) fail()
                current.push({ kind: 'literal', value: '' })
                continue
              }
              if (/[A-Za-z_]/.test(ch)) {
                const start = i++
                while (i < sql.length && /[A-Za-z0-9_$]/.test(sql[i])) i++
                current.push({ kind: 'word', value: sql.slice(start, i).toUpperCase() })
                continue
              }
              if (/[0-9]/.test(ch)) {
                const start = i++
                while (i < sql.length && /[0-9]/.test(sql[i])) i++
                current.push({ kind: 'number', value: sql.slice(start, i) })
                continue
              }
              if ('(),.'.includes(ch)) { current.push({ kind: 'symbol', value: ch }); i++; continue }
              if (ch === ';') {
                if (current.length) statements.push(current)
                current = []
                i++
                continue
              }
              fail()
            }
            if (current.length) statements.push(current)
            if (!statements.length) fail()
            return statements
          }
          function group(tokens, start) {
            if (tokens[start]?.kind !== 'symbol' || tokens[start].value !== '(') fail()
            let depth = 0
            for (let i = start; i < tokens.length; i++) {
              if (tokens[i].kind === 'symbol' && tokens[i].value === '(') depth++
              if (tokens[i].kind === 'symbol' && tokens[i].value === ')') {
                depth--
                if (depth === 0) return { body: tokens.slice(start + 1, i), end: i + 1 }
              }
            }
            fail()
          }
          function splitDefinitions(tokens) {
            const out = []
            let start = 0, depth = 0
            for (let i = 0; i < tokens.length; i++) {
              const t = tokens[i]
              if (t.kind === 'symbol' && t.value === '(') depth++
              if (t.kind === 'symbol' && t.value === ')') depth--
              if (depth < 0) fail()
              if (depth === 0 && t.kind === 'symbol' && t.value === ',') {
                out.push(tokens.slice(start, i)); start = i + 1
              }
            }
            if (depth !== 0) fail()
            out.push(tokens.slice(start))
            if (out.some(x => !x.length)) fail()
            return out
          }
          function identifierList(tokens, start) {
            const g = group(tokens, start)
            let expectIdentifier = true
            for (const t of g.body) {
              if (expectIdentifier && !identifier(t)) fail()
              if (!expectIdentifier && !(t.kind === 'symbol' && t.value === ',')) fail()
              expectIdentifier = !expectIdentifier
            }
            if (expectIdentifier || !g.body.length) fail()
            return g.end
          }
          function parseColumn(tokens) {
            if (!identifier(tokens[0]) || tokens[1]?.kind !== 'word') fail()
            const type = tokens[1].value
            if (!['VARCHAR', 'INTEGER', 'BOOLEAN', 'DATETIME', 'JSON'].includes(type)) fail()
            let i = 2
            if (type === 'VARCHAR' || type === 'DATETIME') {
              const g = group(tokens, i)
              if (g.body.length !== 1 || g.body[0].kind !== 'number') fail()
              i = g.end
            }
            while (i < tokens.length) {
              if (word(tokens[i], 'NOT') && word(tokens[i + 1], 'NULL')) { i += 2; continue }
              if (word(tokens[i], 'NULL')) { i++; continue }
              if (word(tokens[i], 'DEFAULT')) {
                const value = tokens[i + 1]
                if (value?.kind === 'literal' || value?.kind === 'number' || word(value, 'TRUE') || word(value, 'FALSE')) { i += 2; continue }
                if (word(value, 'CURRENT_TIMESTAMP')) {
                  i += 2
                  if (tokens[i]?.kind === 'symbol' && tokens[i].value === '(') {
                    const g = group(tokens, i)
                    if (g.body.length !== 1 || g.body[0].kind !== 'number') fail()
                    i = g.end
                  }
                  continue
                }
                fail()
              }
              fail()
            }
          }
          function parseDefinition(tokens) {
            if (word(tokens[0], 'PRIMARY') && word(tokens[1], 'KEY')) {
              return identifierList(tokens, 2) === tokens.length ? 'PRIMARY_KEY' : fail()
            }
            if (word(tokens[0], 'UNIQUE')) {
              if (!(word(tokens[1], 'INDEX') || word(tokens[1], 'KEY')) || !identifier(tokens[2])) fail()
              return identifierList(tokens, 3) === tokens.length ? 'UNIQUE_INDEX' : fail()
            }
            if (word(tokens[0], 'INDEX') || word(tokens[0], 'KEY')) {
              if (!identifier(tokens[1])) fail()
              return identifierList(tokens, 2) === tokens.length ? 'INDEX' : fail()
            }
            if (word(tokens[0], 'CONSTRAINT')) {
              if (!identifier(tokens[1]) || !word(tokens[2], 'FOREIGN') || !word(tokens[3], 'KEY')) fail()
              let i = identifierList(tokens, 4)
              if (!word(tokens[i], 'REFERENCES') || !identifier(tokens[i + 1])) fail()
              i = identifierList(tokens, i + 2)
              if (!word(tokens[i], 'ON') || !word(tokens[i + 1], 'DELETE') || !word(tokens[i + 2], 'CASCADE') || !word(tokens[i + 3], 'ON') || !word(tokens[i + 4], 'UPDATE') || !word(tokens[i + 5], 'CASCADE') || i + 6 !== tokens.length) fail()
              return 'FOREIGN_KEY'
            }
            parseColumn(tokens)
            return 'COLUMN'
          }
          function classify(tokens) {
            if (word(tokens[0], 'ALTER')) {
              if (!word(tokens[1], 'TABLE') || !identifier(tokens[2]) || !word(tokens[3], 'ADD') || !word(tokens[4], 'COLUMN') || !identifier(tokens[5]) || !word(tokens[6], 'BOOLEAN') || !word(tokens[7], 'NOT') || !word(tokens[8], 'NULL') || !word(tokens[9], 'DEFAULT') || !word(tokens[10], 'TRUE') || tokens.length !== 11) fail()
              return 'ALTER_ADD_COLUMN'
            }
            if (!word(tokens[0], 'CREATE') || !word(tokens[1], 'TABLE') || !identifier(tokens[2])) fail()
            const g = group(tokens, 3)
            const suffix = tokens.slice(g.end)
            const expectedSuffix = ['DEFAULT', 'CHARACTER', 'SET', 'UTF8MB4', 'COLLATE', 'UTF8MB4_UNICODE_CI']
            if (suffix.length !== expectedSuffix.length || suffix.some((t, i) => !word(t, expectedSuffix[i]))) fail()
            const definitions = splitDefinitions(g.body).map(parseDefinition)
            if (!definitions.includes('PRIMARY_KEY') || !definitions.some(x => x === 'COLUMN')) fail()
            return 'CREATE_TABLE'
          }
          try {
            for (const [name, expected] of specs) {
              const dir = path.join(root, name)
              const file = path.join(dir, 'migration.sql')
              const ds = fs.lstatSync(dir), fsInfo = fs.lstatSync(file)
              if (!ds.isDirectory() || ds.isSymbolicLink() || !fsInfo.isFile() || fsInfo.isSymbolicLink() || fsInfo.size < 1 || fsInfo.size > 1024 * 1024) fail()
              const bytes = fs.readFileSync(file)
              const sql = bytes.toString('utf8')
              if (!Buffer.from(sql, 'utf8').equals(bytes)) fail()
              const actual = lex(sql).map(classify)
              if (actual.length !== expected.length || actual.some((kind, i) => kind !== expected[i])) fail()
            }
            console.log('APPROVED_MIGRATION_SQL_COUNT=2')
            console.log('DESTRUCTIVE_SQL_FOUND=NO')
            console.log('MIGRATION_SQL_SAFETY=PASS')
          } catch {
            console.error('::error::Approved migration SQL is not proven additive and safe.')
            process.exitCode = 1
          }
          NODE

      - name: Verify production deployment script uses migrate deploy
        id: deployment_command_safety
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const root = path.resolve('candidate')
          function fail() { throw new Error('deployment command not proven safe') }
          function stripComments(source) {
            return source.split(/\r?\n/).map(line => {
              let quote = '', escaped = false
              for (let i = 0; i < line.length; i++) {
                const ch = line[i]
                if (escaped) { escaped = false; continue }
                if (quote === '"' && ch === '\\') { escaped = true; continue }
                if (quote && ch === quote) { quote = ''; continue }
                if (!quote && (ch === '"' || ch === "'")) { quote = ch; continue }
                if (!quote && ch === '#' && (i === 0 || /\s/.test(line[i - 1]))) return line.slice(0, i)
              }
              return line
            }).join('\n')
          }
          try {
            const files = ['scripts/deploy-safety.sh', 'scripts/deploy-production-git.sh', 'scripts/rollback-production-git.sh']
            const sources = files.map(relative => {
              const file = path.join(root, relative)
              const info = fs.lstatSync(file)
              const real = fs.realpathSync(file)
              if (!info.isFile() || info.isSymbolicLink() || info.size < 1 || info.size > 1024 * 1024 || !real.startsWith(root + path.sep)) fail()
              const bytes = fs.readFileSync(file)
              const text = bytes.toString('utf8')
              if (!Buffer.from(text, 'utf8').equals(bytes)) fail()
              return stripComments(text).replace(/\\\r?\n[ \t]*/g, ' ')
            })
            const deploy = sources[1]
            const rollback = sources[2]
            function functionBody(name) {
              const start = deploy.indexOf(name + '() {')
              if (start < 0) return ''
              const end = deploy.indexOf('\n}', start)
              return end < 0 ? '' : deploy.slice(start, end + 2)
            }
            const timeoutWrapper = functionBody('pnpm_with_timeout')
            const runWrapper = functionBody('pnpm_run')
            const wrappers = timeoutWrapper.includes('timeout ') && timeoutWrapper.includes('"${PNPM_CMD[@]}" "$@"') && runWrapper.includes('pnpm_with_timeout') && runWrapper.includes('"$@"') && runWrapper.includes('= prisma') && runWrapper.includes('= migrate') && runWrapper.includes('= deploy')
            const pnpmAssignments = [...deploy.matchAll(/\bPNPM_CMD=\(([^)]*)\)/g)].map(x => x[1].trim()).sort()
            const pnpmCommandPinned = pnpmAssignments.join('|') === ['', 'corepack pnpm', 'pnpm'].sort().join('|') && !/\bPNPM_CMD\s*\+=|\bPNPM_CMD\s*\[[^\]]+\]\s*=/.test(deploy)
            const commandCount = (deploy.match(/\bpnpm_run\s+prisma\s+migrate\s+deploy\b/g) || []).length
            const all = sources.join('\n')
            const forbiddenDev = /\bprisma\s+migrate\s+dev\b/i.test(all)
            const forbiddenPush = /\bprisma\s+db\s+push\b/i.test(all)
            const forbiddenReset = /\bprisma\s+migrate\s+reset\b/i.test(all)
            const migrationCommands = [...deploy.matchAll(/\b(?:pnpm_run|pnpm_with_timeout)\b[^\n]*?\bprisma\s+migrate\s+([A-Za-z]+)/g)].map(x => x[1].toLowerCase()).sort()
            const rollbackHasDatabaseMutation = /\bprisma\b|_prisma_migrations|\bDATABASE_URL\b|\bDROP\s+(?:TABLE|DATABASE|SCHEMA|COLUMN)\b|\bTRUNCATE\b|\bDELETE\s+FROM\b|\bREPLACE\s+INTO\b|\bRENAME\s+TABLE\b|\bALTER\s+TABLE\b|\bINSERT\s+INTO\b/i.test(rollback)
            if (!wrappers || !pnpmCommandPinned || commandCount !== 1 || forbiddenDev || forbiddenPush || forbiddenReset || migrationCommands.join(',') !== 'deploy,status' || rollbackHasDatabaseMutation) fail()
            console.log('PRODUCTION_MIGRATION_COMMAND=PRISMA_MIGRATE_DEPLOY')
            console.log('MIGRATE_DEV_PRESENT=NO')
            console.log('DB_PUSH_PRESENT=NO')
            console.log('MIGRATE_RESET_PRESENT=NO')
            console.log('APPLICATION_ROLLBACK_SCRIPT_DB_WRITES=NO')
          } catch {
            console.error('::error::Production migration command could not be proven to use migrate deploy safely.')
            process.exitCode = 1
          }
          NODE

      - name: Prepare pinned SSH credentials on runner only
        id: ssh
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PORT: ${{ secrets.SERVER_PORT }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          PINNED_HOSTS: ${{ vars.PRODUCTION_SSH_KNOWN_HOSTS }}
          PINNED_FINGERPRINT: ${{ vars.PRODUCTION_SSH_HOST_KEY_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::SSH host format is unsupported."; exit 1; }
          [[ "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "::error::SSH user format is unsupported."; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "::error::SSH port is invalid."; exit 1; }
          (( 10#$SSH_PORT >= 1 && 10#$SSH_PORT <= 65535 )) || { echo "::error::SSH port is invalid."; exit 1; }
          [[ -n "$SSH_KEY" && -n "$PINNED_HOSTS" && "$PINNED_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]+=?$ ]] || { echo "::error::Pinned SSH settings are incomplete."; exit 1; }
          key="$RUNNER_TEMP/ecfc-server-v3-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.key"
          hosts="$RUNNER_TEMP/ecfc-server-v3-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.hosts"
          # Publish only the runner-temp paths before creating either file so
          # the always() cleanup step can remove partial files after any later
          # validation failure in this step.
          printf 'key_file=%s\nhosts_file=%s\n' "$key" "$hosts" >> "$GITHUB_OUTPUT"
