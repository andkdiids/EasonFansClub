          for expected_line in 'PENDING_COUNT=0' 'FAILED_COUNT=0' 'DIVERGENCE=NO' 'UNEXPECTED_PENDING_MIGRATIONS=0' 'APPROVED_MIGRATION_1=APPLIED' 'APPROVED_MIGRATION_2=APPLIED' 'POST_DEPLOY_MIGRATION_CHECK=PASS'; do
