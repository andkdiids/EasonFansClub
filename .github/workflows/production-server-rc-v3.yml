          const requiredExisting = new Set([
            '20261013100000_add_topic_activity_v2_web','20261013120000_add_topic_activity_v2_lottery',
            '20261013121000_add_topic_lottery_winner_slot_column','20261013122000_add_topic_lottery_winner_slot_index',
            '20261013123000_add_topic_lottery_winner_slot_fk',
          ])
          const lottery = new Set(['20261013120000_add_topic_activity_v2_lottery','20261013121000_add_topic_lottery_winner_slot_column','20261013122000_add_topic_lottery_winner_slot_index','20261013123000_add_topic_lottery_winner_slot_fk'])
          function readTree(root) {
