                  divergence++
                  applied--
                }
                if (requiredExisting.has(name) && status === 'APPLIED' && !(inProduction && inRc && pHash === rHash && dbChecksum === pHash)) {
                  status = 'DIVERGENT'
                  divergence++
                  applied--
                }
                if (lottery.has(name)) {
                  if (inProduction && inRc && succeeded && dbChecksum === pHash && pHash === rHash) lotteryApplied++
                }
                if (status !== 'APPLIED' || !inProduction || !inRc) {
                  console.log(`MIGRATION_DIFF=${name}|IN_PRODUCTION_RELEASE=${inProduction ? 'YES' : 'NO'}|IN_DATABASE_LEDGER=${succeeded ? 'YES' : (ledger.length ? 'NON_SUCCESS' : 'NO')}|IN_RC_V3=${inRc ? 'YES' : 'NO'}|STATUS=${status}`)
                }
              }
              const lotteryOkay = lotteryApplied === lottery.size
              const approvedSetOkay = failed === 0 && divergence === 0 && unexpectedPending === 0 && pending <= approvedPending.size
              console.log(`PRODUCTION_RELEASE_MIGRATION_COUNT=${productionTree.size}`)
              console.log(`DATABASE_LEDGER_ROW_COUNT=${rows.length}`)
              console.log(`DATABASE_APPLIED_COUNT=${applied}`)
              console.log(`RC_MIGRATION_COUNT=${candidateTree.size}`)
              console.log(`PENDING_COUNT=${pending}`)
              console.log(`FAILED_COUNT=${failed}`)
              console.log(`DIVERGENCE=${divergence === 0 ? 'NO' : 'YES'}`)
              console.log(`UNEXPECTED_PENDING_MIGRATIONS=${unexpectedPending}`)
              console.log(`APPROVED_PENDING_ONLY=${approvedSetOkay ? 'YES' : 'NO'}`)
              console.log(`TOPIC_LOTTERY_MIGRATION_STATUS=${lotteryOkay ? 'APPLIED_AND_IDENTICAL' : 'STOP_PENDING_OR_DIVERGENT'}`)
              if (!approvedSetOkay) fail('UNAPPROVED_MIGRATION_STATE')
