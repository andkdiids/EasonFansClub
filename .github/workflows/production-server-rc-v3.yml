          grep -qx 'FAILED_COUNT=0' <<<"$output" || { echo "::error::A failed migration exists."; exit 1; }
          grep -qx 'DIVERGENCE=NO' <<<"$output" || { echo "::error::Migration trees or ledger diverge."; exit 1; }
          grep -qx 'UNEXPECTED_PENDING_MIGRATIONS=0' <<<"$output" || { echo "::error::An unapproved migration is pending."; exit 1; }
          grep -qx 'TOPIC_LOTTERY_MIGRATION_STATUS=APPLIED_AND_IDENTICAL' <<<"$output" || { echo "::error::Topic Activity lottery migrations are not proven applied and identical."; exit 1; }
          worker_pid="$(printf '%s\n' "$output" | sed -n 's/^PM2_WORKER_PID=//p' | tail -n 1)"
          worker_sha="$(printf '%s\n' "$output" | sed -n 's/^WORKER_RELEASE_SHA=//p' | tail -n 1)"
          worker_release="$(printf '%s\n' "$output" | sed -n 's/^WORKER_ACTUAL_RELEASE=//p' | tail -n 1)"
          worker_restarts="$(printf '%s\n' "$output" | sed -n 's/^WORKER_RESTARTS=//p' | tail -n 1)"
          [[ "$worker_pid" =~ ^[1-9][0-9]* && "$worker_sha" =~ ^[0-9a-f]{40}$ && "$worker_release" =~ ^/home/apps/easonfansclub/releases/[^/]+$ && "$worker_restarts" =~ ^[0-9]+$ ]] || { echo "::error::Instagram Worker preservation evidence is invalid."; exit 1; }
          printf 'production_sha=%s\nrollback_sha=%s\nworker_pid=%s\nworker_sha=%s\nworker_release=%s\nworker_restarts=%s\n' "$production_sha" "$rollback_sha" "$worker_pid" "$worker_sha" "$worker_release" "$worker_restarts" >> "$GITHUB_OUTPUT"

      - name: Recheck main, exact RC head, and active production workflows immediately before deployment
        id: last_moment_gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const api = process.env.GITHUB_API_URL
          const repo = process.env.GITHUB_REPOSITORY
          const token = process.env.GH_TOKEN
          const expectedMain = process.env.GITHUB_SHA
          const expectedRc = process.env.CANDIDATE_SHA
          const branch = process.env.CANDIDATE_BRANCH
          const current = String(process.env.GITHUB_RUN_ID)
          const headers = { accept: 'application/vnd.github+json', authorization: 'Bearer ' + token, 'x-github-api-version': '2022-11-28' }
          const protectedPaths = new Set([
            '.github/workflows/configure-production-entry.yml', '.github/workflows/deploy.yml',
            '.github/workflows/production-migration-status.yml', '.github/workflows/production-mysql-client-metadata.yml',
            '.github/workflows/production-release-approved.yml', '.github/workflows/production-strict-readonly-preflight.yml',
            '.github/workflows/production-server-rc-v3.yml',
          ])
          const knownPaths = new Set([...protectedPaths])
          async function getRef(name) {
            const suffix = name.split('/').map(encodeURIComponent).join('/')
            const r = await fetch(`${api}/repos/${repo}/git/ref/heads/${suffix}`, { headers })
            if (!r.ok) throw new Error()
            const j = await r.json()
            if (!/^[0-9a-f]{40}$/.test(j.object?.sha || '')) throw new Error()
            return j.object.sha
          }
          async function list(status, page) {
            const u = new URL(`${api}/repos/${repo}/actions/runs`)
            u.searchParams.set('status', status); u.searchParams.set('per_page', '100'); u.searchParams.set('page', String(page))
            const r = await fetch(u, { headers }); if (!r.ok) throw new Error()
            return r.json()
          }
          async function main() {
            if (await getRef('main') !== expectedMain || await getRef(branch) !== expectedRc) throw new Error()
            let conflicts = 0
            for (const status of ['queued', 'in_progress', 'waiting', 'pending', 'requested']) {
              const first = await list(status, 1)
              if (!Number.isInteger(first.total_count) || !Array.isArray(first.workflow_runs)) throw new Error()
              const total = first.total_count, pages = Math.max(1, Math.ceil(total / 100)); let seen = 0
              const ids = new Set()
              for (let p = 1; p <= pages; p++) {
                const data = p === 1 ? first : await list(status, p)
                if (data.total_count !== total || !Array.isArray(data.workflow_runs) || data.workflow_runs.length > 100) throw new Error()
                seen += data.workflow_runs.length
                for (const run of data.workflow_runs) {
                  if (!Number.isSafeInteger(run.id) || ids.has(String(run.id))) throw new Error()
