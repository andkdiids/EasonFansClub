              for (const name of [...all].sort()) {
                const inProduction = productionTree.has(name)
                const inRc = candidateTree.has(name)
                const ledger = byName.get(name) || []
                const activeFailed = ledger.some(row => !row.finished_at && !row.rolled_back_at)
                const duplicate = ledger.length > 1
                const succeeded = ledger.length === 1 && !!ledger[0].finished_at && !ledger[0].rolled_back_at
                const dbChecksum = ledger.length === 1 ? String(ledger[0].checksum) : ''
                const pHash = productionTree.get(name)
                const rHash = candidateTree.get(name)
                let status = 'UNKNOWN'
                if (activeFailed) { status = 'FAILED'; failed++ }
                else if (duplicate || ledger.some(row => !!row.rolled_back_at) || (inProduction && !inRc) || (!inProduction && !inRc && ledger.length > 0) || (inProduction && inRc && pHash !== rHash) || (ledger.length === 1 && ((pHash && dbChecksum !== pHash) || (rHash && dbChecksum !== rHash)))) { status = 'DIVERGENT'; divergence++ }
