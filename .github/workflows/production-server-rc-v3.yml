          NODE
          printf 'PREFLIGHT=PASS\n'
          REMOTE
          )"
          status=$?
          set -e
          if [[ -n "$output" ]]; then printf '%s\n' "$output"; fi
          [[ "$status" -eq 0 ]] || { echo "::error::Production read-only preflight failed; deployment will not run."; exit "$status"; }
          production_sha="$(printf '%s\n' "$output" | sed -n 's/^PRODUCTION_SHA=//p' | tail -n 1)"
          rollback_sha="$(printf '%s\n' "$output" | sed -n 's/^ROLLBACK_SHA=//p' | tail -n 1)"
          [[ "$production_sha" =~ ^[0-9a-f]{40}$ && "$rollback_sha" == "$production_sha" ]] || { echo "::error::Production or rollback SHA evidence is invalid."; exit 1; }
          grep -qx 'MIGRATION_PREFLIGHT=PASS' <<<"$output" || { echo "::error::Migration reconciliation did not pass."; exit 1; }
