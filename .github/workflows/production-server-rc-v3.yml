                if (activeFailed) failed++
                if (ledger.length === 0) {
                  pending++
                  if (!approved.has(name)) unexpectedPending++
                } else if (ledger.length !== 1 || ledger.some(row => !!row.rolled_back_at)) {
                  divergence++
                } else if (!ledger[0].finished_at) {
