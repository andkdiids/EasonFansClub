              if (seen !== total) throw new Error()
              console.log(`LAST_GATE_${status.toUpperCase()}=${seen}`)
            }
            if (conflicts) throw new Error()
            console.log('LAST_GATE_RC_HEAD=EXACT')
            console.log('LAST_GATE_PRODUCTION_WORKFLOWS=NONE')
          }
