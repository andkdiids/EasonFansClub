          }
          async function main() {
            let candidate
            try {
              candidate = JSON.parse(Buffer.from(process.env.CANDIDATE_MIGRATIONS_B64, 'base64').toString('utf8'))
              if (!Array.isArray(candidate) || candidate.length < 2) fail('CANDIDATE_MANIFEST_INVALID')
              const names = new Set()
              for (const row of candidate) {
                if (!row || !/^\d{14}_[A-Za-z0-9_]+$/.test(row.name) || !/^[0-9a-f]{64}$/.test(row.checksum) || names.has(row.name)) fail('CANDIDATE_MANIFEST_INVALID')
                names.add(row.name)
              }
              for (const name of approvedPending) if (!names.has(name)) fail('APPROVED_MIGRATION_MISSING_FROM_RC')
              for (const name of requiredExisting) if (!names.has(name)) fail('REQUIRED_EXISTING_MIGRATION_MISSING_FROM_RC')
            } catch { fail('CANDIDATE_MANIFEST_INVALID') }
