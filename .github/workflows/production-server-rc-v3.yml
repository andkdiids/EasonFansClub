          APP_RELEASE="$current_target" CANDIDATE_MIGRATIONS_B64="$manifest_b64" node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const approved = new Set([
            '20261022090000_profile_mobile_contract',
            '20261023090000_cantonese_question_progress',
          ])
          const safeErrors = new Set(['MIGRATION_MANIFEST_INVALID', 'APPROVED_MIGRATION_MISSING', 'DATABASE_CONFIGURATION_INVALID', 'MIGRATION_LEDGER_INVALID'])
          function stop(code) { throw new Error(code) }
          async function main() {
            let client
            try {
              const release = process.env.APP_RELEASE
              const manifest = JSON.parse(Buffer.from(process.env.CANDIDATE_MIGRATIONS_B64, 'base64').toString('utf8'))
              if (!Array.isArray(manifest) || manifest.length < 1 || manifest.length > 1000) stop('MIGRATION_MANIFEST_INVALID')
              const expected = new Map()
              for (const item of manifest) {
                if (!item || typeof item.name !== 'string' || !/^\d{14}_[A-Za-z0-9_]+$/.test(item.name) || typeof item.checksum !== 'string' || !/^[0-9a-f]{64}$/.test(item.checksum) || expected.has(item.name)) stop('MIGRATION_MANIFEST_INVALID')
                expected.set(item.name, item.checksum)
              }
              for (const name of approved) if (!expected.has(name)) stop('APPROVED_MIGRATION_MISSING')
              const dotenv = require(path.join(release, 'node_modules/dotenv'))
              const parsed = dotenv.parse(fs.readFileSync(path.join(release, '.env')))
              const databaseUrl = parsed.DATABASE_URL
              if (!databaseUrl || new URL(databaseUrl).protocol !== 'mysql:') stop('DATABASE_CONFIGURATION_INVALID')
              process.env.DATABASE_URL = databaseUrl
              const { PrismaClient } = require(path.join(release, 'node_modules/@prisma/client'))
              client = new PrismaClient({ log: [] })
              await client.$connect()
              const rows = await client.$queryRawUnsafe('SELECT migration_name, checksum, started_at, finished_at, rolled_back_at FROM _prisma_migrations')
              if (!Array.isArray(rows)) stop('MIGRATION_LEDGER_INVALID')
              const byName = new Map()
