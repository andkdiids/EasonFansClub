          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key"
          printf '%s\n' "$PINNED_HOSTS" > "$hosts"
          chmod 600 "$key" "$hosts"
          SSH_HOST="$SSH_HOST" SSH_PORT="$SSH_PORT" HOSTS_FILE="$hosts" node <<'NODE'
          const fs = require('node:fs')
          const lines = fs.readFileSync(process.env.HOSTS_FILE, 'utf8').trim().split(/\r?\n/)
          const expectedHost = process.env.SSH_PORT === '22' ? process.env.SSH_HOST : `[${process.env.SSH_HOST}]:${process.env.SSH_PORT}`
          const fields = lines.length === 1 ? lines[0].trim().split(/\s+/) : []
          if (fields.length !== 3 || fields[0] !== expectedHost || !/^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521))$/.test(fields[1]) || !/^[A-Za-z0-9+/]+={0,2}$/.test(fields[2])) process.exit(1)
          NODE
          actual="$(ssh-keygen -lf "$hosts" -E sha256 | awk '{print $2}')"
          [[ "$actual" == "$PINNED_FINGERPRINT" ]] || { echo "::error::SSH host key fingerprint mismatch."; exit 1; }
          echo 'SSH_HOST_IDENTITY=PINNED_AND_VERIFIED'

      - name: Reject active production operations before SSH
        id: active_preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const api = process.env.GITHUB_API_URL
          const repo = process.env.GITHUB_REPOSITORY
          const token = process.env.GH_TOKEN
          const current = String(process.env.GITHUB_RUN_ID)
          const protectedPaths = new Set([
            '.github/workflows/configure-production-entry.yml',
            '.github/workflows/deploy.yml',
            '.github/workflows/production-migration-status.yml',
            '.github/workflows/production-mysql-client-metadata.yml',
            '.github/workflows/production-release-approved.yml',
            '.github/workflows/production-strict-readonly-preflight.yml',
            '.github/workflows/production-server-rc-v3.yml',
          ])
          const knownPaths = new Set([
            ...protectedPaths,
          ])
          const headers = { accept: 'application/vnd.github+json', authorization: 'Bearer ' + token, 'x-github-api-version': '2022-11-28' }
          async function page(status, pageNumber) {
            const url = new URL(`${api}/repos/${repo}/actions/runs`)
            url.searchParams.set('status', status)
            url.searchParams.set('per_page', '100')
            url.searchParams.set('page', String(pageNumber))
            const response = await fetch(url, { headers })
            if (!response.ok) throw new Error('API unavailable')
            return response.json()
          }
          async function main() {
            let conflictCount = 0
            for (const status of ['queued', 'in_progress', 'waiting', 'pending', 'requested']) {
              const first = await page(status, 1)
              if (!Number.isInteger(first.total_count) || !Array.isArray(first.workflow_runs)) throw new Error('shape invalid')
              const total = first.total_count
              const expectedPages = Math.max(1, Math.ceil(total / 100))
              let count = 0
              const seenIds = new Set()
              for (let number = 1; number <= expectedPages; number++) {
                const data = number === 1 ? first : await page(status, number)
                if (data.total_count !== total || !Array.isArray(data.workflow_runs) || data.workflow_runs.length > 100) throw new Error('pagination changed')
                count += data.workflow_runs.length
                for (const run of data.workflow_runs) {
                  if (!Number.isSafeInteger(run.id) || seenIds.has(String(run.id))) throw new Error('duplicate or invalid run id')
                  seenIds.add(String(run.id))
                  if (String(run.id) === current) continue
                  const runPath = typeof run.path === 'string' ? run.path.split('@', 1)[0] : ''
                  if (!runPath) throw new Error('active run cannot be classified')
                  if (!knownPaths.has(runPath)) throw new Error('active run uses an unrecognized workflow')
                  if (protectedPaths.has(runPath)) conflictCount++
                }
              }
              if (count !== total) throw new Error('pagination incomplete')
              console.log(`ACTIONS_${status.toUpperCase()}=${count}`)
            }
            if (conflictCount !== 0) throw new Error('conflicting production run exists')
            console.log('CONCURRENT_PRODUCTION_RUNS=0')
          }
          main().catch(() => { console.error('::error::Actions state is incomplete or a conflicting production run exists.'); process.exitCode = 1 })
          NODE

      - name: Read production state and reconcile migration trees with the database ledger
        id: production_preflight
        shell: bash
        timeout-minutes: 20
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PORT: ${{ secrets.SERVER_PORT }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          HOSTS_FILE: ${{ steps.ssh.outputs.hosts_file }}
          CANDIDATE_MIGRATIONS_B64: ${{ steps.migrations.outputs.candidate_migrations_b64 }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_MIGRATIONS_B64" =~ ^[A-Za-z0-9+/=]+$ && ${#CANDIDATE_MIGRATIONS_B64} -le 65536 ]] || { echo "::error::Migration manifest is invalid."; exit 1; }
          remote="${SSH_USER}@${SSH_HOST}"
          remote_command="bash -s -- '$APP_DIR' '$CANDIDATE_SHA' '$CANDIDATE_MIGRATIONS_B64'"
