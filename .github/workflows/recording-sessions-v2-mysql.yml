name: Recording Sessions V2 MySQL migration

on:
  pull_request:
    branches:
      - main
    paths:
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
      - 'tests/instagram-text-media-migration.mysql.integration.ts'
      - 'tests/recording-sessions-v2-mysql.integration.ts'
      - 'lib/instagram/**'
      - 'lib/mysql-advisory-lock.ts'
      - 'tests/instagram-lease-lock.mysql.integration.ts'
      - 'tests/instagram-maintenance-protocol.mysql.integration.ts'
      - 'tests/instagram-worker-process.mysql.integration.ts'
      - 'tests/instagram-lease-generation-migration.mysql.integration.ts'
      - 'tests/fixtures/instagram-lease-child.ts'
      - 'lib/activity-redemption.ts'
      - 'lib/activity-registration.ts'
      - 'lib/activity-lottery.ts'
      - 'app/api/admin/activities/**'
      - 'app/api/admin/clinic/**'
      - 'app/api/admin/users/**'
      - 'app/api/admin/user-operations/**'
      - 'lib/admin-user-profile.ts'
      - 'lib/clinic-service.ts'
      - 'tests/clinic-moderation-delete-mysql.test.ts'
      - 'tests/admin-user-profile-http.integration.ts'
      - 'tests/activity-redemption.mysql.integration.ts'
      - 'app/api/shun-master/**'
      - 'tests/shun-master-mysql.test.ts'
      - 'lib/shun-master.ts'
      - 'lib/shun-master-rules.ts'
      - 'lib/music-listening.ts'
      - 'app/api/music/listening/**'
      - 'tests/easmusic-listening.test.ts'
      - 'tests/music-listening.mysql.integration.ts'
      - '.github/workflows/recording-sessions-v2-mysql.yml'

permissions:
  contents: read

jobs:
  migration-integration:
    name: Apply and verify the additive migration on isolated MySQL
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: recording-sessions-qa-only
          MYSQL_DATABASE: recording_sessions_v2_qa
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -precording-sessions-qa-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout pull request source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies and generate Prisma client
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prisma generate

      - name: Verify native administrator writes against isolated MySQL
        env:
          DATABASE_URL: mysql://root:recording-sessions-qa-only@127.0.0.1:3306/ecfc_clinic_qa
          CLINIC_DELETE_MYSQL_QA: '1'
        shell: bash
        run: |
          set -euo pipefail
          mysql --protocol=TCP -h 127.0.0.1 -uroot -precording-sessions-qa-only \
            -e 'CREATE DATABASE ecfc_clinic_qa CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          pnpm exec prisma db push --skip-generate
          pnpm exec tsx --test tests/clinic-moderation-delete-mysql.test.ts

      - name: Create a separate empty Worker safety database
        shell: bash
        run: |
          set -euo pipefail
          mysql --protocol=TCP -h 127.0.0.1 -uroot -precording-sessions-qa-only \
            -e 'CREATE DATABASE ecfc_rc14_worker_qa CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'

      - name: Exercise real MySQL Worker fencing and maintenance protocol
        env:
          RC14_ISOLATED_MYSQL_URL: mysql://root:recording-sessions-qa-only@127.0.0.1:3306/ecfc_rc14_worker_qa
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsx tests/instagram-lease-lock.mysql.integration.ts
          pnpm exec tsx tests/instagram-maintenance-protocol.mysql.integration.ts
          pnpm exec tsx tests/instagram-worker-process.mysql.integration.ts
          pnpm exec tsx tests/instagram-lease-generation-migration.mysql.integration.ts
          pnpm exec tsx tests/instagram-maintenance-helper.mysql.integration.ts

      - name: Apply and verify the Instagram TEXT enum migration on isolated MySQL
        env:
          INSTAGRAM_TEXT_TEST_ADMIN_URL: mysql://root:recording-sessions-qa-only@127.0.0.1:3306/recording_sessions_v2_qa
        shell: bash
        run: pnpm exec tsx tests/instagram-text-media-migration.mysql.integration.ts

      - name: Apply and verify the Recording Sessions V2 migration
        env:
          RECORDING_SESSIONS_TEST_DATABASE_URL: mysql://root:recording-sessions-qa-only@127.0.0.1:3306/recording_sessions_v2_qa
        shell: bash
        run: pnpm exec tsx tests/recording-sessions-v2-mysql.integration.ts

      - name: Exercise EasMusic listening stats on a separate isolated database
        env:
          MUSIC_LISTENING_MYSQL_URL: mysql://root:recording-sessions-qa-only@127.0.0.1:3306/music_listening_qa
        shell: bash
        run: |
          set -euo pipefail
          mysql --protocol=TCP -h 127.0.0.1 -uroot -precording-sessions-qa-only \
            -e 'CREATE DATABASE music_listening_qa CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          trap 'mysql --protocol=TCP -h 127.0.0.1 -uroot -precording-sessions-qa-only -e "DROP DATABASE IF EXISTS music_listening_qa"' EXIT
          pnpm exec tsx tests/music-listening.mysql.integration.ts

      - name: Exercise activity redemption concurrency on a separate isolated database
        env:
          DATABASE_URL: mysql://root:recording-sessions-qa-only@127.0.0.1:3306/activity_redemption_qa
          ACTIVITY_REDEMPTION_MYSQL_URL: mysql://root:recording-sessions-qa-only@127.0.0.1:3306/activity_redemption_qa
        shell: bash
        run: |
          set -euo pipefail
          mysql --protocol=TCP -h 127.0.0.1 -uroot -precording-sessions-qa-only \
            -e 'CREATE DATABASE activity_redemption_qa CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          trap 'mysql --protocol=TCP -h 127.0.0.1 -uroot -precording-sessions-qa-only -e "DROP DATABASE IF EXISTS activity_redemption_qa"' EXIT
          pnpm exec prisma db push --skip-generate
          pnpm exec tsx tests/activity-redemption.mysql.integration.ts

      - name: Verify Shun Master additive migration and concurrent settlements
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DATABASE_URL: mysql://root:recording-sessions-qa-only@127.0.0.1:3306/ecfc_shun_qa?connection_limit=8
          SHUN_MASTER_MYSQL_QA: '1'
        shell: bash
        run: |
          set -euo pipefail
          mysql --protocol=TCP -h 127.0.0.1 -uroot -precording-sessions-qa-only \
            -e 'CREATE DATABASE ecfc_shun_qa CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          git fetch --depth=1 origin "$BASE_SHA"
          base_schema="$(mktemp)"
          trap 'rm -f "$base_schema"' EXIT
          git show "$BASE_SHA:prisma/schema.prisma" > "$base_schema"
          pnpm exec prisma db push --schema "$base_schema" --skip-generate
          initial_migration=prisma/migrations/20261123133000_add_shun_master/migration.sql
          if git cat-file -e "$BASE_SHA:$initial_migration" 2>/dev/null; then
            git show "$BASE_SHA:$initial_migration" | sed -n '/^INSERT INTO /,$p' |
              mysql --protocol=TCP -h 127.0.0.1 -uroot -precording-sessions-qa-only ecfc_shun_qa
          fi
          for migration in prisma/migrations/*_shun_master*/migration.sql; do
            if ! git cat-file -e "$BASE_SHA:$migration" 2>/dev/null; then
              pnpm exec prisma db execute --schema prisma/schema.prisma --file "$migration"
            fi
          done
          pnpm exec tsx --test tests/shun-master-mysql.test.ts

      - name: Verify Shun Master Session and Bearer against the real HTTP server
        env:
          DATABASE_URL: mysql://root:recording-sessions-qa-only@127.0.0.1:3306/ecfc_shun_qa?connection_limit=8
          JWT_SECRET: isolated-shun-ci-session-secret-not-for-production
          MOBILE_ACCESS_TOKEN_SECRET: isolated-shun-ci-mobile-secret-not-for-production
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec next dev --hostname 127.0.0.1 --port 3126 > "$RUNNER_TEMP/shun-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; tail -80 "$RUNNER_TEMP/shun-http.log"' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --output /dev/null http://127.0.0.1:3126/api/shun-master/status; then break; fi
            kill -0 "$server_pid"
            sleep 1
          done
          pnpm exec tsx --test tests/shun-master-http.integration.ts
          pnpm exec tsx --test tests/admin-user-profile-http.integration.ts
