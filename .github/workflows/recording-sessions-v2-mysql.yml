name: Recording Sessions V2 MySQL migration

on:
  pull_request:
    branches:
      - main
    paths:
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
      - 'tests/instagram-text-media-migration.mysql.integration.ts'
      - 'tests/recording-sessions-v2-mysql.integration.ts'
      - 'lib/instagram/**'
      - 'lib/mysql-advisory-lock.ts'
      - 'tests/instagram-lease-lock.mysql.integration.ts'
      - 'tests/instagram-maintenance-protocol.mysql.integration.ts'
      - 'tests/instagram-worker-process.mysql.integration.ts'
      - 'tests/instagram-lease-generation-migration.mysql.integration.ts'
      - 'tests/fixtures/instagram-lease-child.ts'
      - '.github/workflows/recording-sessions-v2-mysql.yml'

permissions:
  contents: read

jobs:
  migration-integration:
    name: Apply and verify the additive migration on isolated MySQL
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: recording-sessions-qa-only
          MYSQL_DATABASE: recording_sessions_v2_qa
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -precording-sessions-qa-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout pull request source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies and generate Prisma client
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prisma generate

      - name: Create a separate empty Worker safety database
        shell: bash
        run: |
          set -euo pipefail
          mysql --protocol=TCP -h 127.0.0.1 -uroot -precording-sessions-qa-only \
            -e 'CREATE DATABASE ecfc_rc14_worker_qa CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'

      - name: Exercise real MySQL Worker fencing and maintenance protocol
        env:
          RC14_ISOLATED_MYSQL_URL: mysql://root:recording-sessions-qa-only@127.0.0.1:3306/ecfc_rc14_worker_qa
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsx tests/instagram-lease-lock.mysql.integration.ts
          pnpm exec tsx tests/instagram-maintenance-protocol.mysql.integration.ts
          pnpm exec tsx tests/instagram-worker-process.mysql.integration.ts
          pnpm exec tsx tests/instagram-lease-generation-migration.mysql.integration.ts

      - name: Apply and verify the Instagram TEXT enum migration on isolated MySQL
        env:
          INSTAGRAM_TEXT_TEST_ADMIN_URL: mysql://root:recording-sessions-qa-only@127.0.0.1:3306/recording_sessions_v2_qa
        shell: bash
        run: pnpm exec tsx tests/instagram-text-media-migration.mysql.integration.ts

      - name: Apply and verify the Recording Sessions V2 migration
        env:
          RECORDING_SESSIONS_TEST_DATABASE_URL: mysql://root:recording-sessions-qa-only@127.0.0.1:3306/recording_sessions_v2_qa
        shell: bash
        run: pnpm exec tsx tests/recording-sessions-v2-mysql.integration.ts
