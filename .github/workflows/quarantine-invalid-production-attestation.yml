name: Quarantine the diagnosed invalid production attestation

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quarantine:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Quarantine the one diagnosed invalid proof
    environment:
      name: Production
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Require a manual dispatch from protected main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo '::error::This fixed-purpose operation is allowed only by manual dispatch from main.'
            exit 1
          }
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]] || {
            echo '::error::GitHub run identity is invalid.'
            exit 1
          }

      - name: Check out the exact dispatched main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Require the protected current main commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/assert-release-main.mjs

      - name: Validate the existing SSH host pin and prepare runner-only files
        id: ssh
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PORT: ${{ secrets.SERVER_PORT }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          PINNED_HOSTS: ${{ vars.PRODUCTION_SSH_KNOWN_HOSTS }}
          PINNED_FINGERPRINT: ${{ vars.PRODUCTION_SSH_HOST_KEY_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9._-]+$ ]] || { echo '::error::Production SSH host format is invalid.'; exit 1; }
          [[ "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo '::error::Production SSH user format is invalid.'; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$SSH_PORT >= 1 && 10#$SSH_PORT <= 65535 )) || {
            echo '::error::Production SSH port format is invalid.'
            exit 1
          }
          [[ -n "$SSH_KEY" && -n "$PINNED_HOSTS" && "$PINNED_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]+=?$ ]] || {
            echo '::error::Pinned production SSH configuration is incomplete.'
            exit 1
          }

          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          key_file="$RUNNER_TEMP/ecfc-proof-quarantine-${suffix}.key"
          hosts_file="$RUNNER_TEMP/ecfc-proof-quarantine-${suffix}.hosts"
          output_file="$RUNNER_TEMP/ecfc-proof-quarantine-${suffix}.out"
          error_file="$RUNNER_TEMP/ecfc-proof-quarantine-${suffix}.err"
          umask 077
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key_file"
          printf '%s\n' "$PINNED_HOSTS" > "$hosts_file"
          : > "$output_file"
          : > "$error_file"
          chmod 600 "$key_file" "$hosts_file" "$output_file" "$error_file"

          SSH_HOST="$SSH_HOST" SSH_PORT="$SSH_PORT" HOSTS_FILE="$hosts_file" node <<'NODE'
          const fs = require('node:fs')
          const lines = fs.readFileSync(process.env.HOSTS_FILE, 'utf8').trim().split(/\r?\n/)
          const expectedHost = process.env.SSH_PORT === '22'
            ? process.env.SSH_HOST
            : `[${process.env.SSH_HOST}]:${process.env.SSH_PORT}`
          const fields = lines.length === 1 ? lines[0].trim().split(/\s+/) : []
          if (fields.length !== 3 || fields[0] !== expectedHost ||
              !/^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521))$/.test(fields[1]) ||
              !/^[A-Za-z0-9+/]+={0,2}$/.test(fields[2])) process.exit(1)
          NODE

          actual_fingerprint="$(ssh-keygen -lf "$hosts_file" -E sha256 | awk 'NR == 1 { print $2 }')"
          [[ "$actual_fingerprint" == "$PINNED_FINGERPRINT" ]] || {
            echo '::error::Production SSH host key does not match the protected fingerprint.'
            exit 1
          }
          printf 'key_file=%s\nhosts_file=%s\noutput_file=%s\nerror_file=%s\n' \
            "$key_file" "$hosts_file" "$output_file" "$error_file" >> "$GITHUB_OUTPUT"
          echo 'PRODUCTION_SSH_HOST_IDENTITY=PINNED_AND_VERIFIED'

      - name: Quarantine only the fixed diagnosed proof under the exclusive production lock
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PORT: ${{ secrets.SERVER_PORT }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          HOSTS_FILE: ${{ steps.ssh.outputs.hosts_file }}
          OUTPUT_FILE: ${{ steps.ssh.outputs.output_file }}
          ERROR_FILE: ${{ steps.ssh.outputs.error_file }}
        run: |
          set -euo pipefail
          [[ -s "$KEY_FILE" && -s "$HOSTS_FILE" ]] || { echo '::error::Pinned SSH identity files are unavailable.'; exit 1; }
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9._-]+$ && "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || exit 1
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$SSH_PORT >= 1 && 10#$SSH_PORT <= 65535 )) || exit 1
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]] || exit 1

          remote_script='set -euo pipefail
          RUN_ID=__RUN_ID__
          RUN_ATTEMPT=__RUN_ATTEMPT__
          APP_DIR=/home/apps/easonfansclub
          LOCK_FILE="$APP_DIR/.deploy.lock"
          test -f "$LOCK_FILE" && test ! -L "$LOCK_FILE" || { echo SERVER_DEPLOY_LOCK_UNAVAILABLE; exit 41; }
          command -v flock >/dev/null 2>&1 && command -v tar >/dev/null 2>&1 && command -v mktemp >/dev/null 2>&1 || { echo REMOTE_RUNTIME_UNAVAILABLE; exit 42; }
          exec 9<>"$LOCK_FILE"
          flock -n 9 || { echo SERVER_DEPLOY_LOCK_BUSY; exit 44; }
          TEMP_DIR="$(mktemp -d "/tmp/ecfc-invalid-proof-quarantine-${RUN_ID}-${RUN_ATTEMPT}.XXXXXXXX")"
          case "$TEMP_DIR" in /tmp/ecfc-invalid-proof-quarantine-"$RUN_ID"-"$RUN_ATTEMPT".*) ;; *) echo TEMP_PATH_INVALID; exit 43 ;; esac
          cleanup_temp() {
            rm -f -- "$TEMP_DIR/production-backup-gate.mjs" "$TEMP_DIR/quarantine-invalid-production-attestation.mjs"
            rmdir -- "$TEMP_DIR" 2>/dev/null || true
          }
          trap cleanup_temp EXIT
          umask 077
          tar -xzf - --no-same-owner --no-same-permissions -C "$TEMP_DIR" -- production-backup-gate.mjs quarantine-invalid-production-attestation.mjs
          test -f "$TEMP_DIR/production-backup-gate.mjs" && test ! -L "$TEMP_DIR/production-backup-gate.mjs"
          test -f "$TEMP_DIR/quarantine-invalid-production-attestation.mjs" && test ! -L "$TEMP_DIR/quarantine-invalid-production-attestation.mjs"
          test "$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1 | wc -l)" -eq 2
          NVM_DIR="${HOME}/.nvm"
          if test -s "$NVM_DIR/nvm.sh"; then . "$NVM_DIR/nvm.sh"; fi
          command -v node >/dev/null 2>&1 || { echo NODE_RUNTIME_UNAVAILABLE; exit 42; }
          QUARANTINE_RUN_ID="$RUN_ID" QUARANTINE_RUN_ATTEMPT="$RUN_ATTEMPT" QUARANTINE_LOCK_HELD=YES \
            node "$TEMP_DIR/quarantine-invalid-production-attestation.mjs" --cli quarantine'
          remote_script="${remote_script/__RUN_ID__/${GITHUB_RUN_ID}}"
          remote_script="${remote_script/__RUN_ATTEMPT__/${GITHUB_RUN_ATTEMPT}}"
          remote_script_b64="$(printf '%s' "$remote_script" | base64 -w0)"
          [[ "$remote_script_b64" =~ ^[A-Za-z0-9+/]+=*$ ]] || { echo '::error::Remote fixed-purpose command encoding failed.'; exit 1; }
          remote_command="bash --noprofile --norc -c \"\$(printf '%s' '${remote_script_b64}' | base64 -d)\""
          remote_host="${SSH_USER}@${SSH_HOST}"
          ssh_options=(
            -p "$SSH_PORT"
            -i "$KEY_FILE"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOSTS_FILE"
            -o GlobalKnownHostsFile=/dev/null
            -o ConnectTimeout=10
            -o ServerAliveInterval=5
            -o ServerAliveCountMax=2
          )

          set +e
          tar -czf - -C scripts production-backup-gate.mjs quarantine-invalid-production-attestation.mjs \
            | timeout --foreground --signal=TERM --kill-after=10s 120s ssh -T "${ssh_options[@]}" \
              "$remote_host" "$remote_command" > "$OUTPUT_FILE" 2> "$ERROR_FILE"
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            safe_status="$(grep -E '^(QUARANTINE_STATUS=REJECTED reason=[A-Z0-9_]+|SERVER_DEPLOY_LOCK_UNAVAILABLE|SERVER_DEPLOY_LOCK_BUSY|REMOTE_RUNTIME_UNAVAILABLE|TEMP_PATH_INVALID|NODE_RUNTIME_UNAVAILABLE)$' "$OUTPUT_FILE" | tail -n 1 || true)"
            if [[ -n "$safe_status" ]]; then echo "$safe_status"; else echo 'QUARANTINE_STATUS=FAILED_CLOSED'; fi
            echo '::error::The fixed proof quarantine did not complete; no automatic retry or evidence cleanup was attempted.'
            exit "$status"
          fi
          grep -Fxq 'QUARANTINE_STATUS=QUARANTINED' "$OUTPUT_FILE" || {
            echo '::error::The server did not confirm the fixed proof quarantine.'
            exit 1
          }
          grep -Fxq 'QUARANTINE_PROOF_SHA256=b7c50aad63c213282ab5b7bc962b24b0461b3723f01e62a72eec11203702460c' "$OUTPUT_FILE"
          grep -Fxq 'QUARANTINE_TARGET_SHA=80b62a5938aba4d2b50075ed0ed55da169c94f4d' "$OUTPUT_FILE"
          cat "$OUTPUT_FILE"

      - name: Remove runner-only SSH and bundle files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -f -- \
            "$RUNNER_TEMP/ecfc-proof-quarantine-${suffix}.key" \
            "$RUNNER_TEMP/ecfc-proof-quarantine-${suffix}.hosts" \
            "$RUNNER_TEMP/ecfc-proof-quarantine-${suffix}.out" \
            "$RUNNER_TEMP/ecfc-proof-quarantine-${suffix}.err"
