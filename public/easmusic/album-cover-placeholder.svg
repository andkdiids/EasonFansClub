<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">EasMusic album cover placeholder</title>
  <desc id="desc">A cassette-inspired placeholder album cover</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173b4a"/>
      <stop offset="1" stop-color="#071820"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65e0ac"/>
      <stop offset="1" stop-color="#8ed8ff"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="12" fill="url(#bg)"/>
  <rect x="16" y="24" width="128" height="92" rx="7" fill="#0d2632" stroke="#6b9aa8" stroke-opacity=".55"/>
  <rect x="29" y="45" width="102" height="34" rx="4" fill="url(#label)" opacity=".92"/>
  <circle cx="52" cy="101" r="10" fill="#08161e" stroke="#9ce7ed" stroke-opacity=".7"/>
  <circle cx="108" cy="101" r="10" fill="#08161e" stroke="#9ce7ed" stroke-opacity=".7"/>
  <path d="M52 101h56" stroke="#9ce7ed" stroke-opacity=".55" stroke-width="3"/>
  <text x="80" y="66" fill="#10252b" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">EASMUSIC</text>
  <text x="80" y="141" fill="#9ed8df" font-family="Arial, sans-serif" font-size="9" letter-spacing="2" text-anchor="middle">NO COVER</text>
</svg>
